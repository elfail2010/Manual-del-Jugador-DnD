                {
                    nombre: "Brujo",
                    icon: "👁️",
                    conjurosDetalle: {"Trucos (Nivel 0)": [{"nombre": "Amigos", "tipo": "Truco, encantamiento", "tiempo": "1 acción", "alcance": "Personal", "componentes": "S, M (un poco de maquillaje aplicado a la cara cuando este conjuro es lanzado)", "duracion": "Concentración, hasta 1 minuto", "desc": "Durante la duración de este conjuro, posees ventaja en todas las pruebas de Carisma dirigidas a una criatura de tu elección que no sea hostil hacia ti. Cuando el conjuro finaliza, la criatura se percata que se ha usado magia para influenciar su humor y se vuelve hostil hacia ti. Una criatura propensa a la violencia podría atacarte. Otra criatura podría buscar alguna otra manera de retribución (a la discreción del DM), dependiendo de la naturaleza de tu interacción con él."}, {"nombre": "Cuchilla Protectora", "tipo": "Nivel 6, nigromancia", "tiempo": "1 acción", "alcance": "60 pies (12 casillas, 18 m)", "componentes": "V, S", "duracion": "Instantánea", "desc": "Liberas una virulenta enfermedad en una criatura que puedes ver dentro del alcance. El objetivo debe realizar una tirada de salvación de Constitución. Si falla la salvación, sufre 14d6 puntos de daño necrótico, o la mitad del daño si supera con éxito la salvación. El daño no puede reducir los Puntos de Golpe del objetivo más allá de 1. Si el objetivo falla la tirada de salvación, sus Puntos de Golpe máximos son reducidos durante 1 hora en una cantidad igual al daño necrótico que recibió. Cualquier efecto que elimine una enfermedad, permite que los Puntos de Golpe de la criatura se recuperen con normalidad antes de que ese tiempo pase. Truco, abjuración Tiempo de lanzamiento: 1 acción Alcance"}, {"nombre": "Estallido arcano", "tipo": "Truco, evocación", "tiempo": "1 acción", "alcance": "120 pies (36 m)", "componentes": "V, S", "duracion": "Instantánea", "desc": "Lanzas una ráfaga de energía crujiente hacia una criatura dentro del alcance. Realiza un ataque de conjuro a distancia. Si impacta, la criatura sufre 1d10 de daño por la fuerza. El conjuro crea más rayos cuando alcanzas niveles superiores: 2 rayos a nivel 5, 3 a nivel 11 y 4 a nivel 17."}, {"nombre": "Ilusión Menor", "tipo": "Truco, ilusión", "tiempo": "1 acción", "alcance": "30 pies (6 casillas, 9 m)", "componentes": "S, M (un pedazo de vellón)", "duracion": "1 minuto", "desc": "Creas un sonido o una imagen de un objeto dentro del alcance que permanece mientras dura el conjuro. La ilusión también finaliza si la disipas como una acción o lanzas de nuevo este conjuro. Si creas un sonido, su volumen puede ir desde un susurro a un grito. Puede ser tu voz, la voz de cualquier otro, el rugido de un león, el batir de tambores, o cualquier otro sonido que elijas. El sonido continúa sin disminuir a lo largo de toda la duración del conjuro, o puedes crear sonidos discretos en momentos diferentes antes de que finalice el conjuro. Si creas la imagen de un objeto, como una silla, huellas en el barro, o un cofre pequeño, no debe ser mayor que un cubo de 5 pies (1 casilla, 1,5 m) "}, {"nombre": "Impacto Verdadero", "tipo": "Truco, adivinación.", "tiempo": "1 acción", "alcance": "30 pies (6 casillas, 12 m)", "componentes": "S", "duracion": "Concentración, hasta 1 asalto", "desc": "Extiendes la mano y apuntas con un dedo a un objetivo a tu alcance. Tu magia te concede una breve visión sobre las defensas de tu objetivo. En tu siguiente turno, obtienes ventaja en tu primera tirada de ataque contra el objetivo, siempre y cuando este conjuro no haya finalizado."}, {"nombre": "Mano de Mago", "tipo": "Truco, conjuración", "tiempo": "1 acción", "alcance": "30 pies (9 m)", "componentes": "V, S", "duracion": "1 minuto", "desc": "Una flotante mano espectral aparece en un punto a tu elección dentro del alcance. La mano permanece mientras dure el conjuro o hasta que la canceles como una acción. La mano desaparece si llega a estar a más de pies (6 casillas, 9 m) de ti o si lanzas este conjuro de nuevo. Puedes usar tu acción para controlar la mano. Puedes utilizar la mano para manipular un objeto, abrir una puerta o contenedor no cerrado con llave, colocar o recuperar un objeto de un contenedor abierto o verter fuera los contenidos de un vial. Puedes mover la mano hasta pies (6 casillas, 9 m) cada vez que la utilizas. La mano no puede atacar, activar objetos mágicos, o transportar más de libras (4 kg)."}, {"nombre": "Prestidigitación", "tipo": "Truco, transmutación", "tiempo": "1 acción", "alcance": "10 pies (3 m)", "componentes": "V, S  331  \fMientras dure el conjuro, la criatura voluntaria que toques tiene resistencia a un tipo de daño de tu elección: ácido, frio, fuego, electricidad o sónico.  Tiempo de lanzamiento: 1 acción Alcance: 500 millas (804 Km) Componentes: V, S, M (una pequeña réplica de ti, hecha con materiales que valgan al menos 5 po)", "duracion": "Concentración, hasta 1 día", "desc": "Creas una copia ilusoria de ti que persiste mientras dure el conjuro. La copia puede aparecer en cualquier ubicación dentro del alcance que hayas visto con anterioridad, independientemente de las barreras que intervengan. La ilusión se ve y suena como tu pero es intangible. Si la ilusión recibe cualquier daño, ésta desaparece, y el conjuro finaliza. Puedes usar una acción para mover esta ilusión hasta el doble de tu velocidad, y hacer que realice gestos, hable y se comporte de cualquier forma que elijas. Ésta copia tus manierismos perfectamente. Puedes ver a través de sus ojos y escuchar a través de sus oídos tal como si estuvieses en ese lugar. En tu turno, como una acción adicional, puedes"}, {"nombre": "Rociada de veneno", "tipo": "Truco, conjuración", "tiempo": "1 acción", "alcance": "10 pies (3 m)", "componentes": "V, S", "duracion": "Instantánea", "desc": "Extiendes la mano y lanzas un chorro de gas venenoso. El objetivo debe superar una salvación de Constitución o sufrir 1d12 de daño por veneno. El daño aumenta con el nivel: 2d12 (nivel 5), 3d12 (nivel 11), 4d12 (nivel 17)."}, {"nombre": "Toque gélido", "tipo": "Truco, nigromancia", "tiempo": "1 acción", "alcance": "120 pies (36 m)", "componentes": "V, S", "duracion": "1 asalto", "desc": "Creas una mano espectral y esquelética en el espacio de una criatura. Realiza un ataque de conjuro a distancia. Si impacta: 1d8 de daño necrótico y la criatura no puede recuperar PG hasta el inicio de tu siguiente turno. Daño: 2d8 (nivel 5), 3d8 (nivel 11), 4d8 (nivel 17)."}], "Nivel 1": [{"nombre": "Armadura de Agathys", "tipo": "Nivel 1, abjuración", "tiempo": "1 acción", "alcance": "Personal", "componentes": "V, S, M (una copa de agua)", "duracion": "1 hora", "desc": "Una fuerza mágica protectora te envuelve como un espectro helado. Ganas 5 PG temporales. Si una criatura te golpea con un ataque cuerpo a cuerpo mientras tienes esos PG temporales, sufre 5 de daño por frío. A niveles superiores: los PG temporales y el daño aumentan 5 por cada nivel adicional."}, {"nombre": "Brazos de Hadar", "tipo": "Nivel 1, conjuración", "tiempo": "1 acción", "alcance": "Personal (radio de 10 pies)", "componentes": "V, S", "duracion": "Instantánea", "desc": "Invocas el poder del Gran Antiguo: tentáculos negros brotan de ti. Cada criatura en un radio de 10 pies realiza una salvación de Fuerza. Fallo: 2d6 de daño necrótico y no puede usar reacciones hasta su siguiente turno. Éxito: la mitad del daño. A niveles superiores: +1d6 por nivel adicional."}, {"nombre": "Comprensión Idiomática", "tipo": "Nivel 1, adivinación (ritual)", "tiempo": "1 acción", "alcance": "Personal", "componentes": "V, S, M (una pizca de hollín y de sal)", "duracion": "1 hora", "desc": "Mientras dura el conjuro, comprendes el significado literal de cualquier idioma hablado que oigas. También comprendes cualquier idioma escrito que veas, pero debes estar tocando la superficie sobre la cual están escritas las palabras. Es necesario alrededor de 1 minuto para leer una página de texto. Este conjuro no descifra mensajes secretos en un texto o un glifo, como en un sello arcano, que no es parte de un idioma escrito. Tiempo de lanzamiento: 1 minuto Alcance: Personal Componentes: V, S Duración: Instantánea Te conviertes en uno con la naturaleza por un breve tiempo y obtienes conocimientos sobre el territorio circundante. En el exterior, el conjuro te proporciona conocimiento de la t"}, {"nombre": "Escritura Ilusoria", "tipo": "Nivel 1, ilusión (ritual)", "tiempo": "1 minuto", "alcance": "Toque", "componentes": "S, M (una tinta con base de plomo con un valor mínimo de 10 po, que será consumido por el conjuro)", "duracion": "10 días", "desc": "Escribes en un pergamino, papel u otro material de escritura adecuado y lo imbuyes con una potente ilusión que se mantiene por la duración del conjuro. Solo para ti y las criaturas que designes cuando estas lanzando el conjuro, la escritura aparece normal, escrita por tu mano y transmites cualquiera que sea el significado que intentas mostrar cuando escribiste el texto. Para los demás, la escritura aparece como si fuera escrita en una mágica o desconocida escritura que es ilegible, alternativamente, puedes provocar que el escrito aparezca ser un mensaje totalmente diferente, escrito por otra mano y lenguaje, aunque el lenguaje tiene que ser uno que tu conozcas. Este conjuro puede ser disipad"}, {"nombre": "Hechizar Persona", "tipo": "Nivel 1, encantamiento", "tiempo": "1 acción", "alcance": "30 pies (6 casillas, 9 m)", "componentes": "V, S", "duracion": "1 hora", "desc": "Puedes intentar hechizar a un humanoide que veas dentro del alcance del conjuro. El objetivo debe realizar una tirada de salvación de Sabiduría, y lo hace con ventaja si tú o tus compañeros estáis luchando contra él. Si falla la tirada de salvación, queda encantado hasta que el conjuro finalice o hasta que tú o tus compañeros le hagáis algo perjudicial. La criatura encantada os considera amigos. Cuando finalice el conjuro, la criatura sabe que ha sido encantada por ti. A niveles superiores. Cuando lanzas este hechizo usando un espacio de conjuro de nivel 2 o superior, puedes elegir como objetivo a una criatura adicional por cada nivel de espacio de conjuros por encima de nivel 1. Las criatur"}, {"nombre": "Mal de ojo", "tipo": "Nivel 1, encantamiento", "tiempo": "1 acción adicional", "alcance": "30 pies (9 m)", "componentes": "V, S", "duracion": "Concentración, hasta 1 minuto", "desc": "Maldices a una criatura visible. Mientras esté maldecida, añades 1d6 de daño necrótico extra cuando la golpeas con un ataque, tiene desventaja en salvaciones de Sabiduría, y si el objetivo cae a 0 PG el conjuro continúa (puedes redirigirlo a otra criatura). A niveles superiores: el dado de daño aumenta."}, {"nombre": "Protección contra el mal", "tipo": "Nivel 1, abjuración", "tiempo": "1 acción", "alcance": "Toque", "componentes": "V, S, M (agua bendita o plata/hierro en polvo)", "duracion": "Concentración, hasta 10 minutos", "desc": "Hasta que el conjuro finalice, una criatura voluntaria que toques está protegida contra aberraciones, celestiales, elementales, hadas, infernales y muertos vivientes. Estas criaturas tienen desventaja en tiradas de ataque contra el objetivo. Además, el objetivo no puede ser encantado, asustado ni poseído por ellas."}, {"nombre": "Reprensión infernal", "tipo": "Nivel 1, evocación", "tiempo": "1 reacción (cuando recibes daño)", "alcance": "60 pies (18 m)", "componentes": "V, S", "duracion": "Instantánea", "desc": "Señalas con el dedo a la criatura que te hizo daño y la envuelves en llamas infernales. La criatura realiza una salvación de Destreza. Fallo: 2d10 de daño por fuego. Éxito: la mitad. A niveles superiores: +1d10 por nivel adicional."}, {"nombre": "Retirada Expeditiva", "tipo": "Nivel 1, transmutación", "tiempo": "1 acción adicional", "alcance": "Personal", "componentes": "V, S", "duracion": "Concentración, hasta 10 minutos", "desc": "Este conjuro te permite moverte a un ritmo increíble. Cuando lanzas este conjuro, y posteriormente, puedes usar una acción adicional en cada uno de tus siguientes turnos hasta que el conjuro finalice, para realizar la acción carrera."}, {"nombre": "Sirviente Invisible", "tipo": "Nivel 1, conjuración (ritual)", "tiempo": "1 acción", "alcance": "60 pies (12 casillas, 18 m)", "componentes": "V, S, M (un trozo de cuerda y un poco de madera)", "duracion": "1 hora", "desc": "Este conjuro crea una fuerza invisible, sin mente ni forma que lleva a cabo tareas sencillas bajo tu orden hasta que el conjuro finaliza. El sirviente aparece en un espacio existente desocupado en el suelo dentro del alcance. Tiene una CA de , 1 punto de golpe, una Fuerza de 2, y no puede atacar. Si baja a 0 Puntos de Golpe, el conjuro finaliza. En cada uno de tus turnos como acción adicional, puedes mandarle mentalmente al sirviente que se mueva hasta pies (3 casillas, 4.5 m) e interactúe con un objeto. El sirviente puede llevar a cabo tareas sencillas que un humano podría hacer, como buscar cosas, limpiar, reparar, doblar ropa, encender fuegos, traer comida, y servir vino. Una vez le des u"}, {"nombre": "Virote encantado", "tipo": "Nivel 1, transmutación", "tiempo": "1 acción adicional", "alcance": "Toque", "componentes": "V, M (una planta muérdago)", "duracion": "1 minuto", "desc": "Tocas hasta tres municiones o armas arrojadizas. Hasta que el conjuro finalice, las municiones se vuelven mágicas. Cada pieza de munición inflige 1d4 de daño por trueno adicional cuando impacta. A niveles superiores: puedes afectar dos municiones adicionales por nivel sobre el 1."}], "Nivel 2": [{"nombre": "Cautivar", "tipo": "Nivel 2, encantamiento", "tiempo": "1 acción", "alcance": "60 pies (18 m)", "componentes": "V, S", "duracion": "1 minuto", "desc": "Tejes una cadena de palabras con el objetivo de distraer, provocando que criaturas de tu elección que puedas ver dentro del alcance y te puedan oír realicen una tirada de salvación de Sabiduría. Cualquier criatura que no pueda ser encantada supera esta tirada de salvación automáticamente, y si tú o tus compañeros estáis luchando contra la criatura, ésta tiene ventaja en la salvación. Con una salvación fallida, el objetivo tiene desventaja en las pruebas de Sabiduría (Percepción) realizadas para percibir cualquier criatura que no seas tú hasta que finalice el conjuro o hasta que el objetivo no pueda oírte. El conjuro finaliza si quedas incapacitado o no puedes hablar."}, {"nombre": "Corona de Locura", "tipo": "Nivel 2, encantamiento", "tiempo": "1 acción", "alcance": "120 pies (24 casillas, 36 m)", "componentes": "V, S", "duracion": "Concentración, hasta 1 minuto", "desc": "Un humanoide de tu elección que puedas ver dentro del alcance del conjuro debe tener éxito en una tirada de salvación de Sabiduría o ser encantado por ti hasta que el conjuro finalice. Mientras el objetivo esté encantado aparece sobre su cabeza una retorcida corona de púas de hierro y un brillo de locura en sus ojos. La criatura encantada debe utilizar su acción antes de mover en cada uno de sus turnos para realizar un ataque cuerpo a cuerpo contra una criatura que no sea ella misma que tú eliges mentalmente. Corcel Fantasmal Nivel 3, ilusión El objetivo puede actuar de forma normal en su turno si no eliges ninguna criatura o si no hay ninguna criatura a su alcance. En los siguientes turnos,"}, {"nombre": "Estallar", "tipo": "Nivel 2, evocación", "tiempo": "1 acción", "alcance": "60 pies (18 m)", "componentes": "V, S, M (pedazo de mica)", "duracion": "Instantánea", "desc": "Un sonido resonante estalla en un punto. Cada criatura en esfera de 10 pies realiza salvación de Constitución. Fallo: 3d8 de daño por trueno; éxito: mitad de daño. Las criaturas que fallen son empujadas 10 pies lejos del centro. A niveles superiores: +1d8 por nivel adicional de espacio de conjuro."}, {"nombre": "Imagen múltiple", "tipo": "Nivel 2, ilusión", "tiempo": "1 acción", "alcance": "Personal", "componentes": "V, S", "duracion": "1 hora", "desc": "Creas tres copias ilusorias de ti mismo. Mientras existan los duplicados, los atacantes no pueden distinguirte de ellos. Cada vez que una criatura te ataca, hay igual probabilidad de golpear a cualquier copia o a ti. Un duplicado desaparece cuando es golpeado. Desaparece también si el atacante tiene visión verdadera."}, {"nombre": "Inmovilizar Persona", "tipo": "Nivel 2, encantamiento", "tiempo": "1 acción", "alcance": "60 pies (18 m)", "componentes": "V, S, M (una pequeña, pieza recta de hierro)", "duracion": "Concentración, hasta 1 minuto", "desc": "Elige un humanoide que puedas ver dentro del alcance. El objetivo debe superar una tirada de salvación de Sabiduría o ser paralizado durante la duración. Al final de cada uno de sus turnos, el objetivo puede intentar otra tirada de salvación de Sabiduría. Si tiene éxito, el conjuro finaliza en el objetivo. A niveles superiores. Cuando lanzas este hechizo usando un espacio de conjuros de nivel 3 o superior, puedes elegir como objetivo a un humanoide adicional por cada nivel de espacio de conjuros por encima de nivel 2. Los humanoides deben de estar a pies (6 casillas, 9 m) uno del otro cuando los selecciones."}, {"nombre": "Invisibilidad", "tipo": "Nivel 2, ilusión", "tiempo": "1 acción", "alcance": "Toque", "componentes": "V, S, M (una pestaña incrustada en goma arábiga)", "duracion": "Concentración, hasta 1 hora", "desc": "Una criatura que tocas se vuelve invisible hasta que finaliza el conjuro. Cualquier cosa que el objetivo este portando o transportando se vuelve invisible siempre que esté sobre la persona objetivo. El conjuro finaliza cuando el objetivo ataca o lanza un conjuro. A niveles superiores. Cuando lanzas este hechizo usando un espacio de conjuros de nivel 3 o superior, puedes elegir como objetivo a una criatura adicional por cada nivel de espacio de conjuros por encima de nivel 2."}, {"nombre": "Nube de Dagas", "tipo": "Nivel 2, conjuración", "tiempo": "1 acción", "alcance": "60 pies (12 casillas, 18 m)", "componentes": "V, S, M (una astilla de vidrio)", "duracion": "Concentración, hasta 1 minuto", "desc": "Llenas el aire de dagas giratorias de un cubo de 5 pies (1 casilla, 1,5 m) de lado. El cubo se crea en un punto a tu elección dentro del alcance del conjuro. Cuando una criatura entra en el área del conjuro por primera vez en un turno o comienza su turno dentro del área sufre 4d4 puntos de daño cortante. A niveles superiores. Cuando lanzas este hechizo usando un espacio de conjuros de nivel 3 o superior, el daño se incrementa en 2d4 por cada nivel de espacio de conjuros por encima de nivel 2. es empujada pies (2 casillas, 3 m) de ti. Si supera la tirada, la criatura sufre la mitad del daño y no es empujada. Además, los objetos no fijos que estén completamente dentro del alcance son empujados"}, {"nombre": "Oscuridad", "tipo": "Nivel 2, evocación", "tiempo": "1 acción", "alcance": "60 pies (18 m)", "componentes": "V, M (pelusa de murciélago y gota de brea o carbón)", "duracion": "Concentración, hasta 10 minutos", "desc": "La oscuridad mágica se extiende desde un punto dentro del alcance llenando una esfera de 15 pies de radio hasta que finalice el conjuro. La oscuridad se extiende alrededor de las esquinas. Una criatura con visión en la oscuridad no puede ver a través de esta oscuridad, y la luz no mágica no puede iluminarla."}, {"nombre": "Paso brumoso", "tipo": "Nivel 2, conjuración", "tiempo": "1 acción adicional", "alcance": "Personal", "componentes": "V", "duracion": "Instantánea", "desc": "Brevemente envuelto en niebla plateada, te teletransportas a un espacio desocupado que puedas ver hasta 30 pies de distancia."}, {"nombre": "Rayo de debilitamiento", "tipo": "Nivel 2, nigromancia", "tiempo": "1 acción", "alcance": "60 pies (18 m)", "componentes": "V, S", "duracion": "Concentración, hasta 1 minuto", "desc": "Un rayo de energía debilitadora parte de tu dedo hacia una criatura visible. El objetivo realiza una salvación de Constitución. Si falla, tiene desventaja en las tiradas de ataque de Fuerza y pruebas de Fuerza, y sus armas infligen la mitad del daño. Puede repetir la salvación al final de cada turno."}, {"nombre": "Sugestión", "tipo": "Nivel 2, encantamiento", "tiempo": "1 acción", "alcance": "30 pies (6 casillas, 9 m)", "componentes": "V, M (una lengua de serpiente y una gota de aceite dulce o un trozo de panal)", "duracion": "Concentración, hasta 8 horas", "desc": "Sugieres el curso de una actividad (limitado a un par de frases) e influyes mágicamente a una criatura a la que puedas ver dentro del alcance que pueda escucharte y entenderte. Las criaturas inmunes al encantamiento son inmunes a este efecto. La sugerencia debe realizarse de manera que la acción suene razonable. Pedir a una criatura que se apuñale, se lance contra una lanza, se inmole, o haga algo obviamente dañino finaliza el conjuro al momento. El objetivo debe realizar una tirada de salvación por Carisma. Si falla la salvación, intentará realizar la acción que has sugerido de la mejor manera posible. El transcurso de la acción que has sugerido continúa durante toda la duración del conjuro"}, {"nombre": "Trepar cual arácnido", "tipo": "Nivel 2, transmutación", "tiempo": "1 acción", "alcance": "Toque", "componentes": "V, S, M (una gota de betún y una araña)", "duracion": "Concentración, hasta 1 hora", "desc": "Hasta que el conjuro finalice, una criatura voluntaria que toques obtiene la capacidad de trepar por superficies verticales y bocabajo en techos, con las manos libres. La criatura también tiene velocidad de trepar igual a su velocidad de caminar."}], "Nivel 3": [{"nombre": "Círculo mágico", "tipo": "Nivel 3, abjuración", "tiempo": "1 minuto", "alcance": "10 pies (3 m)", "componentes": "V, S, M (sal, polvo de plata, hierro en polvo — 100 po)", "duracion": "1 hora", "desc": "Creas un cilindro mágico de 10 pies de radio y 20 de alto en torno a un punto del suelo. Puedes elegir uno o más tipos de criaturas (aberraciones, celestiales, elementales, hadas, infernales, muertos vivientes). Las criaturas elegidas no pueden entrar voluntariamente al área ni pueden encantar/poseer/asustar a los que están dentro. A niveles superiores: +1 hora por nivel."}, {"nombre": "Contraconjuro", "tipo": "Nivel 3, abjuración", "tiempo": "1 reacción (cuando ves a una criatura lanzar un conjuro)", "alcance": "60 pies (18 m)", "componentes": "S", "duracion": "Instantánea", "desc": "Intentas interrumpir el lanzamiento de un conjuro. Si la criatura lanza un conjuro de nivel 3 o inferior, falla y no tiene efecto. Si lanza uno de nivel 4 o superior, realizas una prueba de característica de conjuro CD igual a 10 + el nivel del conjuro. Si tienes éxito, el conjuro de la criatura falla."}, {"nombre": "Disipar Magia", "tipo": "Nivel 3, abjuración", "tiempo": "1 acción", "alcance": "120 pies (36 m)", "componentes": "V, S", "duracion": "Instantánea", "desc": "Elige una criatura, objeto o efecto mágico dentro del alcance. Cualquier conjuro de nivel 3 o inferior en el objetivo finaliza, Por cada conjuro de nivel 4 o superior en el objetivo, realiza una prueba de característica usando tu característica de lanzamiento de conjuros. La CD es igual a + el nivel del conjuro. Con una prueba con éxito, el conjuro finaliza. A niveles superiores. Cuando lanzas este hechizo usando un espacio de conjuros de nivel 4 o superior, finalizas automáticamente efectos de conjuros en el objetivo si el nivel del conjuro a disipar es igual o menor que el nivel del espacio de conjuros que usaste."}, {"nombre": "Don de lenguas", "tipo": "Nivel 3, adivinación", "tiempo": "1 acción", "alcance": "Toque", "componentes": "V, M (barro fosilizado)", "duracion": "1 hora", "desc": "La criatura que toques puede entender cualquier idioma hablado. Además, cuando habla, cualquier criatura que entienda un idioma puede entenderla. El conjuro no otorga la capacidad de leer idiomas escritos."}, {"nombre": "Forma gaseosa", "tipo": "Nivel 3, transmutación", "tiempo": "1 acción", "alcance": "Toque", "componentes": "V, S, M (un poco de gasa y humo)", "duracion": "Concentración, hasta 1 hora", "desc": "Transforma a una criatura voluntaria que toques, junto a lo que lleve, en una nube de vapor. En esta forma: es incapaz de hablar o manipular objetos; es incapaz de atacar o lanzar conjuros; tiene velocidad de vuelo de 10 pies con vuelo estacionario; puede pasar por pequeños agujeros y grietas; tiene resistencia a daño no mágico; tiene ventaja en salvaciones de Fuerza, Destreza y Constitución."}, {"nombre": "Hambre de Hadar", "tipo": "Nivel 3, conjuración", "tiempo": "1 acción", "alcance": "150 pies (45 m)", "componentes": "V, S, M (una pieza de tentáculo de pulpo en escabeche)", "duracion": "Concentración, hasta 1 minuto", "desc": "Abres una puerta a la oscuridad entre las estrellas. Aparece una esfera de oscuridad de 20 pies de radio que dura mientras dura el conjuro. Ninguna luz puede iluminarla. Las criaturas que comiencen su turno ahí sufren 2d6 de daño por frío. Las criaturas que terminen su turno ahí deben superar salvación de Destreza o 2d6 de daño por ácido."}, {"nombre": "Imagen Mayor", "tipo": "Nivel 3, ilusión", "tiempo": "1 acción", "alcance": "120 pies (24 casillas, 36 m)", "componentes": "V, S, M (un pedazo de vellón)", "duracion": "Concentración, hasta 10 minutos", "desc": "Creas la ilusión visual de un objeto, una criatura o algún otro fenómeno visible que no sea mayor que un cubo de pies (4 casillas, 6 m) de lado. La ilusión aparece en un lugar que puedas ver dentro del alcance. Parece completamente real, incluyendo los sonidos, olores y temperatura apropiada de la cosa mostrada. No puedes crear suficiente calor o frío para causar daño, ni un ruido lo suficientemente alto para infligir daño sónico o dejar ensordecida a una criatura, ni un olor que pueda dejar incapacitada a una criatura (como el hedor de un troglodita). Mientras este dentro del alcance del conjuro, puedes usar tu acción para hacer que la ilusión se mueva hacia cualquier lugar dentro del alcan"}, {"nombre": "Miedo", "tipo": "Nivel 3, ilusión", "tiempo": "1 acción", "alcance": "Personal (cono de 30 pies)", "componentes": "V, S, M (pluma blanca o corazón de gallina)", "duracion": "Concentración, hasta 1 minuto", "desc": "Proyectas una imagen fantasmal de los peores miedos en un cono de 30 pies. Cada criatura en el área hace salvación de Sabiduría o deja caer lo que sujeta, queda asustada y debe usar su acción para huir. Al final de cada turno puede repetir la salvación si está fuera de tu línea de visión."}, {"nombre": "Pauta hipnótica", "tipo": "Nivel 3, encantamiento", "tiempo": "1 acción", "alcance": "120 pies (36 m)", "componentes": "V, S, M (brasa incandescente)", "duracion": "Concentración, hasta 1 minuto", "desc": "Creas un patrón de colores que gira en el aire en un cubo de 30 pies dentro del alcance. Cada criatura visible en el área que pueda ver el patrón debe superar una salvación de Sabiduría o queda hechizada durante la duración. Las criaturas hechizadas quedan incapacitadas y tienen velocidad 0. El efecto termina si la criatura recibe daño."}, {"nombre": "Quitar maldición", "tipo": "Nivel 3, abjuración", "tiempo": "1 acción", "alcance": "Toque", "componentes": "V, S", "duracion": "Instantánea", "desc": "Con tu toque, todas las maldiciones que afecten a la criatura objetivo finalizan. Si el objetivo es un objeto mágico maldito, su maldición permanece pero el personaje ya no está obligado a usarlo."}, {"nombre": "Toque vampírico", "tipo": "Nivel 3, nigromancia", "tiempo": "1 acción", "alcance": "Personal", "componentes": "V, S", "duracion": "Concentración, hasta 1 minuto", "desc": "La sombra de la muerte aparece en tu mano. Realiza un ataque de conjuro cuerpo a cuerpo contra una criatura dentro de tu alcance. Si impacta: 3d6 de daño necrótico. Recuperas PG iguales a la mitad del daño infligido. Hasta que el conjuro finalice, puedes repetir el ataque en cada turno. A niveles superiores: +1d6 por nivel adicional."}, {"nombre": "Volar", "tipo": "Nivel 3, transmutación", "tiempo": "1 acción", "alcance": "Toque", "componentes": "V, S, M (una pluma de algún ave)", "duracion": "Concentración, hasta 10 minutos", "desc": "Tocas a una criatura voluntaria. El objetivo obtiene velocidad de vuelo de 60 pies durante la duración. Cuando el conjuro termina, el objetivo cae si aún está en el aire, a menos que pueda detener la caída. A niveles superiores: puedes afectar a una criatura adicional por nivel sobre el 3."}], "Nivel 4": [{"nombre": "Destierro", "tipo": "Nivel 4, abjuración", "tiempo": "1 acción", "alcance": "60 pies (18 m)", "componentes": "V, S, M (un objeto desagradable para el objetivo)", "duracion": "Concentración, hasta 1 minuto", "desc": "Intentas enviar a una criatura a otro plano. El objetivo realiza una salvación de Carisma. Si falla, es desterrado. Si es nativo de tu plano, queda incapacitado hasta que el conjuro termina, momento en que regresa. Si es de otro plano, vuelve a su plano y solo regresa si el conjuro termina antes de 1 minuto."}, {"nombre": "Marchitar", "tipo": "Nivel 4, nigromancia", "tiempo": "1 acción", "alcance": "10 pies (3 m)", "componentes": "V, S", "duracion": "Instantánea", "desc": "Concentras la energía negativa en una criatura que puedas ver. Debe realizar una salvación de Constitución. Fallo: 8d8 de daño necrótico. Éxito: la mitad. No afecta a muertos vivientes ni constructos. A niveles superiores: +1d8 por nivel adicional sobre el 4."}, {"nombre": "Puerta Dimensional", "tipo": "Nivel 4, conjuración", "tiempo": "1 acción", "alcance": "500 pies (1.125 m)", "componentes": "V", "duracion": "Instantánea", "desc": "Te trasladas desde tu ubicación actual hasta otro lugar dentro del alcance. Llegas exactamente al lugar deseado. Puede ser un lugar que puedas ver, uno que puedas visualizar o uno que puede describir declarando la distancia y la Proyectar Imagen Nivel 7, ilusión Una línea de fuerte viento de pies (casillas, m) de largo y pies (2 casillas, 3 m) de ancho sale disparada de ti en la dirección que elijas por la duración del conjuro. Cada criatura que comience su turno en la línea debe superar una tirada de salvación de Fuerza o ser empujado pies (3 casillas, 4.5 m) de ti en la dirección de la línea. Cualquier criatura en la línea debe gastar 2 pies de movimiento por cada 1 pie si trata de acercar"}, {"nombre": "Terreno Alucinatorio", "tipo": "Nivel 4, ilusión", "tiempo": "10 minutos", "alcance": "300 pies (90 m)", "componentes": "V, S, M (una piedra, una ramita y un pedacito de una planta verde)", "duracion": "24 horas", "desc": "Haces que un terreno natural en un cubo de pies (casillas, m) dentro del alcance se vea, suene y huela como otro tipo de terreno natural. Por lo tanto, terrenos abiertos o caminos puede ser semejantes a un pantano, una colina, una cueva u otro tipo de terreno difícil o impasable. Un estanque puede hacerse parecer a una llanura llena de pasto, un precipicio a una pendiente sueva, o un barranco pedregoso en un amplio y suave camino. Estructuras manufacturadas, equipo y criaturas en el área no pueden ser cambiados en apariencia. Las características táctiles del terreno no son cambiadas, por lo que las criaturas que entran en el área es probable que se den cuenta de la ilusión. Si la diferencia "}], "Nivel 5": [{"nombre": "Contactar con otro plano", "tipo": "Nivel 5, adivinación (ritual)", "tiempo": "1 minuto", "alcance": "Personal", "componentes": "V", "duracion": "1 minuto", "desc": "Mentalmente contactas a una semidivinidad, el espíritu de un mago muerto hace tiempo, u otra entidad misteriosa de otro plano. Puedes hacer hasta 5 preguntas de sí/no. Cada respuesta es 'sí', 'no', 'quizás', 'desconocido' o 'sin importancia'. Fallas una salvación de Inteligencia CD 15: sufres el efecto de Locura hasta completar un descanso largo."}, {"nombre": "Escudriñamiento", "tipo": "Nivel 5, adivinación", "tiempo": "10 minutos", "alcance": "Personal", "componentes": "V, S, M (un foco con un valor de al menos 1.000 po, tal como una bola de cristal, un espejo de plata o una pila llena de agua bendita)", "duracion": "Concentración, hasta 10 minutos", "desc": "Conocimiento Segunda mano (has oído del objetivo) Primera mano (has conocido al objetivo) Familiar (conoces bien al objetivo) Conexión Retrato o fotografía Posesión de una prenda Parte del cuerpo, mechón de pelo, trozo de uña, o similar Modificador de salvación +5 +0 -5 Modificador de salvación -2 -4 -Esfera Elástica de Otiluke Nivel 4, evocación Tiempo de lanzamiento: 1 acción Alcance: pies (6 casillas, 9 m) Componentes: V, S, M (una trozo de cristal claro semiesférico y un trozo semiesférico de goma arábiga que haga pareja con el primero) Duración: Concentración, hasta 1 minuto Una esfera de fuerza y brillante envuelve a una criatura u objeto de tamaño Grande o menor dentro del alcance. Un"}, {"nombre": "Inmovilizar monstruo", "tipo": "Nivel 5, encantamiento", "tiempo": "1 acción", "alcance": "90 pies (27 m)", "componentes": "V, S, M (un trozo de cuerda)", "duracion": "Concentración, hasta 1 minuto", "desc": "Elige una criatura visible. Debe superar una salvación de Sabiduría o queda paralizada durante la duración. Al final de cada turno puede repetir la salvación. A diferencia de Inmovilizar persona, funciona en cualquier tipo de criatura, no solo humanoides. A niveles superiores: afecta una criatura adicional por nivel sobre el 5."}, {"nombre": "Mensaje onírico", "tipo": "Nivel 5, evocación", "tiempo": "1 minuto", "alcance": "Especial", "componentes": "V, S, M (un puñado de arena, gota de tinta y pluma escritora)", "duracion": "8 horas", "desc": "Envías un mensaje a un receptor durmiendo (o lo induces a dormir). Entras en sus sueños y apareces como lo desees. El mensaje puede durar hasta 10 minutos. El objetivo recuerda el sueño perfectamente. Si el objetivo está despierto, lo sabes y el conjuro termina. Si el objetivo está protegido contra adivinación, falla."}], "Nivel 6": [{"nombre": "Círculo de muerte", "tipo": "Nivel 6, nigromancia", "tiempo": "1 acción", "alcance": "150 pies (45 m)", "componentes": "V, S, M (polvo de hueso molido — 500 po)", "duracion": "Instantánea", "desc": "Una esfera de energía negativa de 60 pies de radio explota desde un punto que eliges. Cada criatura viva en esa área realiza una salvación de Constitución. Fallo: 8d6 de daño necrótico. Éxito: la mitad. A niveles superiores: +2d6 por nivel adicional sobre el 6."}, {"nombre": "Conjurar ser feérico", "tipo": "Nivel 6, conjuración", "tiempo": "1 minuto", "alcance": "60 pies (18 m)", "componentes": "V, S", "duracion": "Concentración, hasta 1 hora", "desc": "Convocas a un ser feérico de CR 6 o inferior, o hasta dos seres feéricos de CR 3 o inferior que aparecen en espacios desocupados. Obedecen tus órdenes verbales. Desaparecen cuando llegan a 0 PG o cuando el conjuro termina. A niveles superiores: puedes convocar seres de CR más alto."}, {"nombre": "Crear muerto viviente", "tipo": "Nivel 6, nigromancia", "tiempo": "1 minuto", "alcance": "10 pies (3 m)", "componentes": "V, S, M (arcilla negra y sal, tocino de cerdo y trozos de hueso — 500 po cada uno)", "duracion": "Instantánea", "desc": "Puedes animar hasta tres cadáveres de humanoides medianos o pequeños en un radio de 10 pies. Los cadáveres se convierten en ghoul bajo tu control. Cada mes debes relanzar el conjuro para mantener el control. Los ghouls obedecen tus órdenes verbales. A niveles superiores: Level 7 creas 4; nivel 8 creas 5; nivel 9 creas 6."}, {"nombre": "De la carne a la piedra", "tipo": "Nivel 6, transmutación", "tiempo": "1 acción", "alcance": "60 pies (18 m)", "componentes": "V, S, M (una pizca de cal, agua y tierra)", "duracion": "Concentración, hasta 1 minuto", "desc": "Intentas convertir a una criatura visible en piedra. El objetivo realiza una salvación de Constitución. Fallo: queda restringido mientras el conjuro dura (su cuerpo se vuelve rígido). Si así permanece toda la duración, se petrifica permanentemente hasta que se deshaga el efecto."}, {"nombre": "Mirada Penetrante", "tipo": "Nivel 6, nigromancia", "tiempo": "1 acción", "alcance": "Personal", "componentes": "V, S", "duracion": "Concentración, hasta 1 minuto", "desc": "Mientras dure el conjuro tus ojos se tornan de un vacío oscuro, imbuidos con el poder del terror. Una criatura de tu elección hasta a pies (casillas, m) de ti que puedas ver debe superar una tirada de salvación de Sabiduría o ser afectada por uno de los efectos siguientes a tu elección, mientras dure el conjuro. En cada uno de tus turnos hasta que el conjuro finalice, puedes usar tu acción para seleccionar otra criatura como objetivo, pero no puedes seleccionar a una criatura que ya haya superada la salvación contra este lanzamiento de mirada penetrante. Dormido. El objetivo cae inconsciente. Se despierta si recibe cualquier daño o si otra criatura usa su acción para despertarle. Presa del p"}, {"nombre": "Portal arcano", "tipo": "Nivel 6, conjuración", "tiempo": "1 acción", "alcance": "500 pies (150 m)", "componentes": "V, S", "duracion": "1 asalto", "desc": "Creas portales vinculados en dos espacios desocupados que puedas ver. Cualquier criatura que entra por uno de los portales emerge del otro. Los portales tienen forma de arco de 10 pies de alto y 5 de ancho. Un portal puede usarse hasta que el conjuro termina al final de tu siguiente turno."}, {"nombre": "Sugestión de masas", "tipo": "Nivel 6, encantamiento", "tiempo": "1 acción", "alcance": "60 pies (18 m)", "componentes": "V, M (lengua de serpiente, o panal y aceite dulce)", "duracion": "24 horas", "desc": "Sugieres un curso de acción razonable a hasta 12 criaturas de tu elección visibles. Las que fallen la salvación de Sabiduría siguen la sugestión durante la duración. La sugestión debe sonar razonable. A niveles superiores: duración aumenta (Nivel 7: 10 días, Nivel 8: 30 días, Nivel 9: 1 año)."}, {"nombre": "Visión Verdadera", "tipo": "Nivel 6, adivinación", "tiempo": "1 acción", "alcance": "Toque", "componentes": "V, S, M (un ungüento para los ojos de 25 po de valor; está hecho de polvo de setas, azafrán y grasa; que el conjuro consume)", "duracion": "1 hora", "desc": "Este conjuro proporciona a la criatura voluntaria que tocas, la habilidad de ver las cosas como realmente son. Mientras dure el conjuro, la criatura tiene visión verdadera, se da cuenta de puertas secretas ocultas por magia, y puede ver en el Plano Etéreo, todo en un alcance de pies (casillas, m). adicional por cada nivel de espacio de conjuros por encima de nivel 1."}], "Nivel 7": [{"nombre": "Dedo de la muerte", "tipo": "Nivel 7, nigromancia", "tiempo": "1 acción", "alcance": "60 pies (18 m)", "componentes": "V, S", "duracion": "Instantánea", "desc": "Envías energía negativa hacia una criatura visible. Realiza una salvación de Constitución. Fallo: 7d8 + 30 de daño necrótico. Éxito: la mitad. Un humanoide asesinado por este conjuro se levanta al comienzo de tu siguiente turno como zombi permanentemente bajo tu control."}, {"nombre": "Desplazamiento de plano", "tipo": "Nivel 7, conjuración", "tiempo": "1 acción", "alcance": "Toque", "componentes": "V, S, M (horquilla de metal del mismo material que el plano de destino — 250 po)", "duracion": "Instantánea", "desc": "Usos: (1) Transporte: tú y hasta 8 criaturas voluntarias que se unan de la mano son transportadas al plano de existencia que especifiques. (2) Expulsión: una criatura que toques realiza una salvación de Carisma. Si falla, es transportada al semiplano aleatorio. Puede usar sus propios recursos para escapar."}, {"nombre": "Etereidad", "tipo": "Nivel 7, transmutación", "tiempo": "1 acción", "alcance": "Personal", "componentes": "V, S", "duracion": "Hasta 8 horas", "desc": "Te adentras en las regiones fronterizas del Plano Etéreo, en un área la cual se solapa con tu plano actual. Permaneces en la"}, {"nombre": "Jaula de Fuerza", "tipo": "Nivel 7, evocación", "tiempo": "1 acción", "alcance": "100 pies (20 casillas, 30 m)", "componentes": "V, S, M (polvo de rubí de un valor mínimo de 1.500 po)", "duracion": "1 hora", "desc": "Una prisión inmóvil e invisible en forma de cubo compuesta de fuerza mágica brota alrededor de un área que elijas dentro del alcance. La prisión puede ser una jaula o una caja sólida, a tú elección. Una prisión en forma de jaula puede ser de hasta pies (4 casillas, 6 m) de lado y estar hecha de barras ½ pulgada (1.3 cm) separadas entre ellas por ½ pulgada (1.3 cm). Una prisión en forma de caja puede ser de hasta pies (2 casillas, 3 m) de lado, creando una sólida barrera que previene cualquier intento de pasar a través de ella y bloqueando cualquier lanzamiento de conjuros fuera del área de la caja. Cuando lanzas este conjuro, cualquier criatura que esté completamente dentro de la jaula es at"}], "Nivel 8": [{"nombre": "Debilidad Mental", "tipo": "Nivel 8, encantamiento", "tiempo": "1 acción", "alcance": "150 pies (30 casillas, 45 m)", "componentes": "V, S, M (un puñado de arcilla, cristal, vidrio o esferas minerales)", "duracion": "Instantánea", "desc": "Haces estallar la mente de una criatura que puedas ver dentro del alcance, tratando de quebrar su intelecto y personalidad. El objetivo sufre 4d6 puntos de daño psíquico y debe realizar una tirada de salvación de Inteligencia. Si falla la salvación, las puntuaciones de característica de Inteligencia y Carisma de la criatura se convierten en 1. La criatura no puede lanzar conjuros, activar objetos mágicos, entender idiomas, o comunicarse de cualquier manera inteligible. La criatura puede, en todo caso, identificar a sus amigos, seguirlos y hasta protegerlos. Cada días, la criatura puede repetir la tirada de salvación contra el conjuro. Con una salvación con éxito el conjuro finaliza. El conju"}, {"nombre": "Dominar Monstruo", "tipo": "Nivel 8, encantamiento", "tiempo": "1 acción", "alcance": "60 pies (18 m)", "componentes": "V, S", "duracion": "Concentración, hasta 1 hora", "desc": "Intentas hechizar a una criatura a la que puedas ver dentro del alcance. Esta debe superar una tirada de salvación de Sabiduría o quedar encantada mientras dure el conjuro. Si tú o criaturas aliadas contigo estáis luchando contra ella, esta tiene ventaja en la tirada de salvación. Don de Lenguas Nivel 3, adivinación. Tiempo de lanzamiento: 1 acción. Alcance: Toque. Componentes: V, M (un pequeño modelo de arcilla de un zigurat). Duración: 1 hora. Este conjuro concede a la criatura que toques la habilidad de entender cualquier idioma que escuche. Más allá de eso, cuando el objetivo habla, cualquier criatura que conozca al menos un idioma y que pueda oír al objetivo entiende qué está diciendo."}, {"nombre": "Labia", "tipo": "Nivel 8, transmutación", "tiempo": "1 acción", "alcance": "Personal", "componentes": "V", "duracion": "1 hora", "desc": "Hasta que el conjuro finalice, cuando realices una prueba de Carisma, puedes remplazar el número de tu tirada por un . Además, no importa lo que digas, la magia para determinar si estás diciendo la verdad indicara que estas siendo honesto."}, {"nombre": "Palabra de Poder Aturdir", "tipo": "Nivel 8, encantamiento", "tiempo": "1 acción", "alcance": "60 pies (12 casillas, 18 m)", "componentes": "V", "duracion": "Instantánea", "desc": "Pronuncias una palabra de poder que puede abrumar la mente de una criatura que puedas ver dentro del alcance. Si el objetivo tiene Puntos de Golpe o menos, quedará aturdido. De otro modo, el conjuro no tiene efecto. El objetivo aturdido debe realizar una tirada de salvación de Constitución al final cada uno de sus turnos. Con una salvación con éxito, el efecto de aturdimiento termina."}, {"nombre": "Semiplano", "tipo": "Nivel 8, conjuración", "tiempo": "1 acción", "alcance": "60 pies (18 m)", "componentes": "S", "duracion": "1 hora", "desc": "Creas una puerta hacia un semiplano extradimensional en una superficie sólida de 5 pies cuadrados. El interior es una habitación vacía de 30 pies en cada dirección, con paredes, suelo y techo de madera. Cualquier criatura que entre emerge en el semiplano. La puerta desaparece cuando termina el conjuro."}], "Nivel 9": [{"nombre": "Cautiverio", "tipo": "Nivel 9, abjuración", "tiempo": "1 minuto", "alcance": "30 pies (9 m)", "componentes": "V, S, M (un rubí — 1.500 po)", "duracion": "Hasta que se deshaga", "desc": "Aprisiona a una criatura en un estado semipermanente. Elige uno de los efectos: enterrar, encadenar, convertir en estatua, adormecer, lanzar a otra dimensión o poner bajo un efecto de destierro. La criatura realiza una salvación de Sabiduría. Si falla queda atrapada indefinidamente."}, {"nombre": "Palabra de Poder Matar", "tipo": "Nivel 9, encantamiento", "tiempo": "1 acción", "alcance": "60 pies (12 casillas, 18 m)", "componentes": "V", "duracion": "Instantánea", "desc": "Pronuncias una palabra de poder que puede obligar a una criatura, que puedes ver dentro del alcance, a morir al instante. Si la criatura que eliges tiene Puntos de Golpe o menos, ésta muere. De otro modo, el conjuro no tiene efecto."}, {"nombre": "Polimorfismo Verdadero", "tipo": "Nivel 9, transmutación", "tiempo": "1 acción", "alcance": "30 pies (6 casillas, 9 m)", "componentes": "V, S, M (una gota de mercurio, una pizca de resina árabe, y una voluta de humo)", "duracion": "Concentración, hasta 1 hora", "desc": "Escoge una criatura o un objeto no mágico que puedas ver dentro del alcance. Transformas a la criatura en una criatura diferente, a la criatura en un objeto, o el objeto en una criatura (el objeto no puede ser sujeto o transportado por otra criatura). La transformación dura hasta que finaliza el conjuro, o hasta que el objetivo se queda a 0 Puntos de Golpe o muere. Si te concentras en este conjuro durante el máximo tiempo posible, la transformación se vuelve permanente. Los cambiaformas no se ven afectados por este conjuro. Una criatura que se oponga a la transformación puede realizar una tirada de salvación de Sabiduría, y si la supera, no se ve afectada por este conjuro. De criatura a cria"}, {"nombre": "Presciencia", "tipo": "Nivel 9, adivinación", "tiempo": "1 acción", "alcance": "Toque", "componentes": "V, S, M (una pluma de colibrí)", "duracion": "8 horas", "desc": "Tocas una criatura voluntaria y le otorgas una habilidad limitada para ver en el futuro inmediato. Durante la duración del conjuro el objetivo no puede ser sorprendido y posee ventaja en tiradas de ataque, pruebas de característica y tiradas de salvación. Además, otras criaturas tienen desventaja en tiradas de ataque contra el objetivo durante la duración del conjuro. Este conjuro finaliza inmediatamente si se vuelve a conjurar antes de que la duración finalice."}, {"nombre": "Proyección astral", "tipo": "Nivel 9, nigromancia", "tiempo": "1 hora", "alcance": "10 pies (3 m)", "componentes": "V, S, M (jacinto — 1.000 po, y barra de plata — 100 po, por cada criatura)", "duracion": "Especial", "desc": "Tú y hasta 8 criaturas consentidas proyectáis vuestros cuerpos astrales al Plano Astral. Vuestros cuerpos físicos quedan en suspensión. En el Plano Astral podéis explorar sin límite. Si el hilo plateado que os conecta se corta, vuestras almas y cuerpos astrales son destruidos."}]},

                    conjurosDetalle: {"Trucos (nivel 0)": [{"nombre": "Llama Sagrada", "tipo": "truco, evocación", "tiempo": "1 acción", "alcance": "60 pies", "componentes": "V, S", "duracion": "instantanea", "desc": "Un resplandor parecido a una llama desciende sobre una criatura que puedas ver y esté dentro del alance. El objetivo debe superar una tirada de salvación de Destreza o sufrir 1d8 puntos de daño radiante. El objetivo no gana ningún beneficio por cobertura para esta tirada de salvación. El daño de este conjuro se incrementa en 1d8 cuando alcanzas el 5º nivel (2d8), 11º nivel (3d8) y 17º nivel (4d8)."}, {"nombre": "Luz", "tipo": "truco, evocación", "tiempo": "1 acción", "alcance": "toque", "componentes": "V, M (una luciérnaga o musgo fluorescente)", "duracion": "1 hora", "desc": "Tocas un objeto que no mida más de 10 pies (2 casillas, 3 m) en cualquier dimensión. Hasta que finalice el conjuro, el objeto desprende una luz brillante en un radio de 20 pies (4 casillas, 6 m) y luz tenue para 20 pies (4 casillas, 6 m) adicionales. La luz puede tener el color que quieras. Cubrir completamente el objeto con algo opaco bloquea la luz. El conjuro finaliza si lo lanzas de nuevo o lo disipas como una acción. Si tienes como objetivo un objeto que está sujeto o transportado por una criatura hostil, esta criatura debe superar una tirada de salvación de Destreza para evitar el conjuro."}, {"nombre": "Remendar", "tipo": "truco, transmutación", "tiempo": "1 minuto", "alcance": "toque", "componentes": "V, S, M (dos calamitas)", "duracion": "instantanea", "desc": "Con este conjuro puedes reparar un objeto roto o rasgado. El objeto se vuelve a unir y el conjuro no tiene efecto sobre objetos mágicos o que hayan sido dañados de alguna manera mágica. El conjuro tampoco puede reparar una criatura que haya sufrido daño."}, {"nombre": "Resistencia", "tipo": "truco, abjuración", "tiempo": "1 acción", "alcance": "toque", "componentes": "V, S, M (una capa en miniatura)", "duracion": "concentración, hasta 1 minuto", "desc": "Tocas a una criatura voluntaria. Antes de que el conjuro finalice, el objetivo puede tirar 1d4 y añadir el número del resultado a una tirada se salvación de su elección. Puede tirar el dado antes o después de hacer la tirada de salvación. Luego el conjuro finaliza."}, {"nombre": "Orientación divina", "tipo": "truco, adivinación", "tiempo": "1 acción", "alcance": "toque", "componentes": "V, S", "duracion": "concentración, hasta 1 minuto", "desc": "Tocas a una criatura voluntaria. Antes de que el conjuro finalice, el objetivo puede añadir un d4 a una habilidad de su elección. Puede tirar el dado antes o después de hacer la tirada de habilidad. Luego el conjuro finaliza."}, {"nombre": "Perdonar la vida", "tipo": "truco, nigromancia", "tiempo": "1 acción", "alcance": "toque", "componentes": "V, S", "duracion": "instantanea", "desc": "Tocas a una criatura viviente que tenga 0 Puntos de Golpe. La criatura se estabiliza. Este conjuro no tiene efecto en muertos vivientes ni en constructos."}, {"nombre": "Taumaturgia", "tipo": "truco, transmutación", "tiempo": "1 acción", "alcance": "30 pies (6 casillas, 9 m)", "componentes": "V", "duracion": "concentración, hasta 1 minuto", "desc": "Realizas una pequeña maravilla, un signo de un poder sobrenatural, dentro del alcance. Puedes crear uno de los siguientes efectos mágicos dentro del alcance: - Tu voz resuena hasta tres veces más fuerte de lo normal durante 1 minuto. - Creas llamas que parpadean, iluminan, se oscurecen o cambian de color durante 1 minuto. - Causas inofensivos temblores en el suelo durante 1 minuto. - Creas un sonido instantáneo que se origina en un punto dentro del alcance a tu elección, como el estallido de un trueno, el llanto de un cuervo o murmullos ominosos. - Haces que una puerta sin cerradura se abra de golpe o se cierre con un golpe. - Alteras la apariencia de tus ojos durante 1 minuto. Si lanzas este conjuro múltiples veces puedes tener activados hasta 3 efectos a la vez durante 1 minuto, y puedes hacer desaparecer uno de los efectos como acción."}],
                    "Nivel 1": [{"nombre": "Bendecir", "tipo": "nivel 1, encantamiento", "tiempo": "1 acción", "alcance": "30 pies (6 casillas, 9 m)", "componentes": "V, S M (una rociada de agua bendita)", "duracion": "concentración, hasta 1 minuto", "desc": "Hasta tres criaturas de tu elección que puedas ver dentro del alcance reciben un bono de +1d4 a las tiradas de ataque o a las tiradas de salvación de habilidad. El conjuro finaliza si lo lanzas de nuevo o si tu concentración se rompe. A niveles superiores, puedes realizar esto tantas veces como niveles tengas superiores a 1."}, {"nombre": "Crear o destruir agua", "tipo": "nivel 1, transmutación", "tiempo": "1 acción", "alcance": "30 pies (6 casillas, 9m)", "componentes": "V, S, M (una gota de agua si quieres crear o unos pocos granos de arena si quieres destruir)", "duracion": "instantanea", "desc": "Puedes crear o destruir agua. Crear agua. Creas 10 galones (37 litros) de agua limpia en un recipiente que se encuentra dentro del alcance del conjuro. Alternativamente, el agua cae como lluvia en un cubo de 30 pies cuadrados (6 casillas, 9 m), extinguiendo las llamas que puede haber en ese área. Destruir agua. Destruyes 10 galones (37 litros) de agua que se encuentre en un recipiente situado dentro del alcance del conjuro. Alternativamente, destruyes niebla en un cubo cuadrado de 30 pies (6 casillas, 9 m) dentro del alcance del conjuro. A niveles superiores. Cuando lanzas este hechizo usando un espacio de conjuros de nivel 2 o superior, puedes crear 291 o destruir 10 galones (37 litros) de agua adicionales, o aumentar en 5 pies (1 casillas, 1,5 m) el tamaño del cubo, por cada nivel de espacio de conjuros por encima de nivel 1."}, {"nombre": "Curar heridas", "tipo": "nivel 1, evocación", "tiempo": "1 acción", "alcance": "toque", "componentes": "V, S", "duracion": "instantanea", "desc": "Una criatura que toques recupera una cantidad de puntos de golpe igual a 1d8 + tu modificador de característica para lanzar conjuros. Este conjuro no tiene efecto sobre muertos vivientes ni constructos. A niveles superiores la curación se incrementa en 1d8 tantos niveles como tengas por encima del nivel 1"}, {"nombre": "Detectar el bien y el mal", "tipo": "nivel 1, adivinación", "tiempo": "1 acción", "alcance": "personal", "componentes": "V, S", "duracion": "concentración, hasta 10 minutos", "desc": "Mientras dure el conjuro, sabes si hay aberraciones, celestiales, feéricos, infernales o muertos vivientes a 30 pies (6 casillas, 9 m) de ti, y también la localización de la criatura. De manera similar, sabes si un lugar u objeto hasta a 30 pies (6 casillas, 9 m) de ti ha sido mágicamente sacralizado o desacralizado. El conjuro puede penetrar en la mayoría de barreras, pero es bloqueado por 1 pie (30 cm) de piedra, 1 pulgada (2,5 cm) de metal común, una delgada capa de plomo o 3 pies (90 cm) de madera o suciedad."}, {"nombre": "Detectar magia", "tipo": "nivel 1, divinación (ritual)", "tiempo": "1 acción", "alcance": "personal", "componentes": "V, S", "duracion": "concentración, hasta 10 minutos", "desc": "Mientras dura el conjuro, sientes la presencia de la magia a menos de 30 pies (6 casillas, 9 m) de ti. Si sientes magia de esta forma, puedes utilizar tu acción para ver un aura débil alrededor de cualquier criatura u objeto visibles en al área que posee magia, y averiguar su escuela de magia, si existe. El conjuro puede penetrar en la mayoría de barreras, pero es bloqueado por 1 pie (30 cm) de piedra, 1 pulgada (2,54 cm) de metal común, una delgada capa de plomo o 3 pies (90 cm) de madera o suciedad."}, {"nombre": "Detectar venenos y enfermedades", "tipo": "nivel 1, adivinación (ritual)", "tiempo": "1 acción", "alcance": "personal", "componentes": "V, S, M (una hoja de tejo)", "duracion": "concentración, hasta 10 minutos", "desc": "Mientras dure el conjuro, notas la presencia y localización de venenos, criaturas venenosas y enfermedades hasta a 30 pies (6 casillas, 9 m) de ti. También identificas el tipo de veneno, criatura venenosa o enfermedad en cada caso. El conjuro puede penetrar en la mayoría de barreras, pero es bloqueado por 1 pie (30 cm) de piedra, 1 pulgada (2,5 cm) de metal común, una delgada capa de plomo o 3 pies (90 cm) de madera o suciedad."}, {"nombre": "Escudo de la fe", "tipo": "nivel 1, abjuración", "tiempo": "1 acción adicional", "alcance": "60 pies (12 casillas, 18 m)", "componentes": "V, S, M (un pequeño pergamino con un poco de texto sagrado en él)", "duracion": "concentración, hasta 10 minutos", "desc": "Un campo reluciente aparece y rodea a una criatura de tu elección que este dentro del alcance, otorgándole un bonificador de +2 a su CA durante la duración del conjuro."}, {"nombre": "Infligir heridas", "tipo": "nivel 1, nigromancia", "tiempo": "1 acción", "alcance": "toque", "componentes": "V, S", "duracion": "instantanea", "desc": "Realiza un ataque de conjuro cuerpo a cuerpo contra una criatura que tengas al alcance. En un impacto con éxito, el objetivo sufre 3d10 puntos de daño necrótico. A niveles superiores. Cuando lanzas este hechizo usando un espacio de conjuros de nivel 2 o superior, el daño se incrementa en 1d10 por cada nivel del espacio de conjuros por encima de nivel 1."}, {"nombre": "Orden imperiosa", "tipo": "nivel 1, encantamiento", "tiempo": "1 acción", "alcance": "60 pies (12 casillas, 18 m)", "componentes": "V", "duracion": "1 asalto", "desc": "Gritas una orden condensada en una palabra a una criatura que puedas ver dentro del alcance del conjuro. El objetivo debe superar una tirada de salvación de Sabiduría o cumplir la orden en su siguiente turno. El conjuro no tiene efecto si el objetivo es un muerto viviente, si no comprende tu idioma, o si tu orden es directamente dañina para él. A continuación tienes algunas típicas órdenes y sus efectos. Puedes dar una orden distinta a las descritas aquí. Si lo haces, el DM determina cómo se comporta el objetivo. Si el objetivo no puede cumplir tu orden, el conjuro finaliza. Acércate. El objetivo se mueve hacia ti por la ruta más corta y directa, terminando su turno si llega a menos de 5 pies (1 casilla, 1,5 m) de ti. Suéltalo. El objetivo suelta cualquier cosa que este sujetando y luego termina su turno. Huye. El objetivo gasta su turno alejándose de ti de la forma más rápida posible. Túmbate. El objetivo se tira al suelo y queda tumbado y termina su turno. Detente. El objetivo no se mueve y no lleva a cabo acciones. Una criatura voladora permanece en el aire, volando a la distancia mínima necesaria para mantenerse en el aire. A niveles superiores. Cuando lanzas este hechizo usando un espacio de conjuros de nivel 2 o superior, puedes afectar a una criatura adicional por cada nivel de espacio de conjuros por encima de nivel 1. Las criaturas deben estar a menos de 30 pies (6 casillas, 9 m) una de otra cuando las eliges como objetivo."}, {"nombre": "Palabra sanadora", "tipo": "nivel 1, evocación", "tiempo": "1 acción adicional", "alcance": "60 pies (12 casillas, 18 m)", "componentes": "V", "duracion": "instantanea", "desc": "Una criatura que puedas ver dentro del alcance recupera una cantidad de puntos de golpe igual a 1d4 + tu modificador de característica para lanzar conjuros. Este conjuro no tiene efecto sobre muertos vivientes ni constructos. A niveles superiores la curación se incrementa en 1d4 tantos niveles como tengas por encima del nivel 1"}, {"nombre": "Perdición", "tipo": "nivel 1, encantamiento", "tiempo": "1 acción", "alcance": "30 pies (6 casillas, 9 m)", "componentes": "V, S, M (una gota de sangre)", "duracion": "concentración, hasta 1 minuto", "desc": "Hasta tres criaturas de tu elección que puedas ver dentro del alcance deben superar una tirada de salvación de carisma o sufrir el efecto del conjuro. El objetivo afectado por este conjuro sufre un penalizador de -1d4 a las tiradas de ataque y a las tiradas de salvación de habilidad. A niveles superiores puedes afectar a un objetivo adicional"}, {"nombre": "Protección contra el bien y el mal", "tipo": "nivel 1, abjuración", "tiempo": "1 acción", "alcance": "toque", "componentes": "V, S, M (agua bendita o plata y hierrro en polv, que el conjuro consume)", "duracion": "concentración, hasta 10 minutos", "desc": "Hasta que el conjuro finalice, una criatura voluntaria que toques está protegida contra ciertas criaturas: aberraciones, celestiales, feéricos, infernales o muertos vivientes. El conjuro tiene los siguientes efectos sobre la criatura protegida: - La criatura no puede ser hechizada, poseída ni asustada por estas criaturas. - Si la criatura es hostil a estas criaturas, tiene ventaja en las tiradas de ataque contra ellas. - Si la criatura es atacada por estas criaturas, recibe un bonificador de +2 a la CA y a las tiradas de salvación contra sus ataques y efectos."}, {"nombre": "Purificar comida y bebida", "tipo": "nivel 1, transmutación (ritual)", "tiempo": "1 acción", "alcance": "10 pies (2 casillas, 3 m)", "componentes": "V, S", "duracion": "instantanea", "desc": "Toda comida y bebida no mágica dentro de un radio de 5 pies (1 casilla, 1.5 m), centrado en esfera en un punto de tu elección dentro del alcance, es purificada y queda libre de venenos y enfermedades."}, {"nombre": "Rayo guiado", "tipo": "nivel 1, evocación", "tiempo": "1 acción adicional", "alcance": "120 pies (24 casillas, 36 m)", "componentes": "V, S", "duracion": "1 asalto", "desc": "Un destello de luz golpea directamente a una criatura de tu elección dentro del alcance. Realiza un ataque de conjuro a distancia contra el objetivo. Si aciertas, el objetivo sufre 4d6 puntos de daño radiante, y el siguiente ataque realizado contra el objetivo antes de que finalice tu siguiente turno tiene ventaja, gracias a la tenue luz mística que brilla en el objetivo hasta entonces. A niveles superiores. Cuando lanzas este hechizo usando un espacio de conjuros de nivel 2 o superior, el daño se incrementa por 1d6 por cada nivel de espacio de conjuros por encima de nivel 1."}, {"nombre": "Santuario", "tipo": "nivel 1, abjuración", "tiempo": "1 acción adicional", "alcance": "30 pies (6 casillas, 9 m)", "componentes": "V, S, M (un pequeño amuleto con un símbolo sagrado)", "duracion": "1 minuto", "desc": "Proteges a una criatura que toques contra ataques. Hasta que el conjuro finalice, cualquier criatura hostil que intente atacar al objetivo debe superar una tirada de salvación de Sabiduría o no podrá realizar el ataque contra el objetivo. Si el objetivo ataca o lanza un conjuro que afecte a una criatura hostil, el conjuro finaliza."}],
                "Nivel 2": [{"nombre": "Arma espiritual", "tipo": "nivel 2, evocación", "tiempo": "1 acción adicional", "alcance": "60 pies (12 casillas, 18 m)", "componentes": "V, S", "duracion": "1 minuto", "desc": "Creas un arma espectral flotante dentro del alcance que persiste durante la duración o hasta que lances otro conjuro. Cuando lanzas el conjuro, puedes realizar un ataque de conjuro cuerpo a cuerpo contra una criatura a 5 pies (1 casilla, 1.5 m) del arma. Si impacta, el objetivo sufre 1d8 + tu modificador de característica de lanzador de conjuros como daño por fuerza. Como acción adicional en tu turno, puedes mover el arma hasta 20 pies (4 casillas, 6 m) y repetir el ataque contra una criatura a 5 pies (1 casilla, 1.5 m) de la misma. El arma puede tomar la forma que tú prefieras. Los clérigos de deidades asociadas con ciertas armas (como St. Cuthbert, conocido por su maza o Thor por su martillo) le dan la forma asociada con su deidad. A niveles superiores. Cuando lanzas este hechizo usando un espacio de conjuros de nivel 3 o superior, el daño se incrementa en 1d8 por cada nivel de espacio de conjuros por encima de nivel 2."}, {"nombre": "Augurio", "tipo": "nivel 2, adivinación (ritual)", "tiempo": "1 acción", "alcance": "personal", "componentes": "V, S, M (palillos con marcas especiales, huesos o fichas parecidas de un valor mínimo de 25 po)", "duracion": "instantanea", "desc": "Ya sea lanzando palillos con gemas incrustadas, lanzando huesos de dragón, disponiendo cartas con ilustraciones o empleando alguna otra herramienta de adivinación, una entidad de otro mundo te proporciona un presagio sobre los resultados del curso de una acción específica que planeas llevar a cabo en los siguientes 30 minutos. El DM elige entre los siguientes presagios posibles: - Dicha, para buenos resultados. - Desdicha, para malos resultados. - Dicha y desdicha, para resultados tanto buenos como malos. - Nada, para resultados que no son especialmente buenos o malos. El conjuro no tiene en cuenta cualquier circunstancia posible que podría cambiar el resultado, como por ejemplo el lanzamiento de conjuros adicionales, o la pérdida o llegada de un compañero. 273 Si lanzas el conjuro dos veces o más antes de completar tu próximo descanso prolongado, existe un 25% acumulativo por cada lanzamiento después del primero que obtengas una lectura al azar. El DM realiza esta tirada en secreto."}, {"nombre": "Aumentar característica", "tipo": "nivel 2, transmutación", "tiempo": "1 acción", "alcance": "toque", "componentes": "V, S, M (pelaje o pluma de una bestia)", "duracion": "concentración, hasta 1 hora", "desc": "Tocas una criatura y le concedes una mejora mágica. Elige uno de los siguientes efectos; el objetivo gana el efecto hasta que el conjuro finalice. Resistencia de oso. El objetivo tiene ventaja en las pruebas de Constitución. También gana 2d6 Puntos de Golpe temporales, que se pierden cuando el conjuro finaliza. Fuerza de toro. El objetivo tiene ventaja en las pruebas de Fuerza y su capacidad de carga se dobla. Gracia Felina. El objetivo tiene ventaja en las pruebas de Destreza. Además no recibe daño por caídas de 20 pies (4 casillas, 6 m) o menos si no está incapacitado. Esplendor de águila. El objetivo tiene ventaja en las pruebas de Carisma. Astucia de zorro. El objetivo tiene ventaja en las pruebas de Inteligencia. Sabiduría de búho. El objetivo tiene ventaja en las pruebas de Sabiduría. A niveles superiores. Cuando lanzas este hechizo usando un espacio de conjuros de 3º nivel o superior, puedes seleccionar una criatura adicional por cada nivel de espacio de conjuros por encima de nivel 2."}, {"nombre": "Auxilio divino", "tipo": "nivel 2, abjuración", "tiempo": "1 acción", "alcance": "30 pies (6 casillas, 9 m)", "componentes": "V, S, M (una tira diminuta de tela blanca)", "duracion": "8 horas", "desc": "Tu conjuro refuerza a tus aliados con tenacidad y determinación. Elige hasta tres criaturas que estén dentro del alcance. Mientras dura el efecto del conjuro, aumentan en 5 los Puntos de Golpe máximos y los Puntos de Golpe actuales de cada objetivo. A niveles superiores. Cuando lanzas este hechizo usando un espacio de conjuros de nivel 3 o superior, los Puntos de Golpe del objetivo se incrementan en 5 puntos adicionales por cada nivel de espacio de conjuros por encima de nivel 2."}, {"nombre": "Calmar emociones", "tipo": "nivel 2, encantamiento", "tiempo": "1 acción", "alcance": "60 pies (12 casillas, 18 m)", "componentes": "V, S", "duracion": "concentración, hasta 1 minuto", "desc": "Intentas suprimir emociones fuertes que afectan a un grupo de personas. Cada humanoide en una esfera de radio 20 pies (4 casillas, 6 m) centrado en un punto que elijas dentro del alcance, debe realizar una tirada de salvación de Carisma; una criatura puede elegir fallar esta tirada si así lo desea. Si la criatura falla la tirada de salvación elige uno de los dos siguientes efectos. Puedes suprimir cualquier efecto que causa que el objetivo esté en estado encantado o asustado. Cuando finalice el conjuro, cualquier efecto disipado vuelve, siempre y cuando la duración de la condición no hubiera expirado antes. Alternativamente, puedes hacer que un objetivo permanezca indiferente hacia criaturas de tu elección contra las que es abiertamente hostil. Esta indiferencia finaliza si el objetivo es atacado o herido directamente por un conjuro, o si es testigo de que alguno de sus amigos están siendo dañados. Cuando el conjuro finaliza la criatura vuelve a ser hostil otra vez, salvo que el DM precise lo contrario."}, {"nombre": "Ceguera/Sordera", "tipo": "nivel 2, necromancia", "tiempo": "1 acción", "alcance": "30 pies (6 casillas, 9 m)", "componentes": "V", "duracion": "1 minuto", "desc": "Puedes cegar o dejar sordo a un enemigo. Elige una criatura que puedas ver dentro del alcance para que realice una tirada de salvación de Constitución. Si la tirada de salvación falla, el objetivo queda cegado o ensordecido (a tu elección) durante la duración del 281 conjuro. Al final de cada turno, el objetivo puede realizar una tirada de salvación de Constitución. En caso de éxito, el conjuro finaliza. A niveles superiores. Cuando lanzas este hechizo usando un espacio de conjuros de nivel 3 o superior, puedes elegir como objetivo una criatura adicional por cada nivel de espacio de conjuros por encima de nivel 2."}, {"nombre": "Descanso apacible", "tipo": "nivel 2, nigromancia (ritual)", "tiempo": "1 acción", "alcance": "toque", "componentes": "V, S, M (una pizca de sal y una pieza de cobre colocada en cada uno de los ojos del cuerpo, los cuales deben permanecer ahí por toda la duración)", "duracion": "10 días", "desc": "Tocas un cadáver o cualquiera de sus restos. Por la duración del conjuro, el objetivo se encuentra protegido de la descomposición y no puede convertirse en muerto viviente. Este conjuro también aumenta el tiempo límite para alzar al objetivo de entre los muertos, porque los días pasados bajo la influencia de este conjuro no cuentan en el tiempo límite de conjuros tales como revivir a los muertos."}, {"nombre": "Encontrar trampas", "tipo": "nivel 2, adivinación", "tiempo": "1 acción", "alcance": "120 pies (24 casillas, 36 m)", "componentes": "V, S", "duracion": "instantánea", "desc": "Sientes la presencia de cualquier trampa dentro del alcance que esté dentro de la línea de visión. Una trampa, para el propósito de este conjuro, incluye cualquier cosa que pueda infligir un efecto repentino o inesperado que consideres perjudicial o indeseable, que fue específicamente planeado como tal por su creador. Así, el conjuro podría sentir el área de efecto de un conjuro alarma, un glifo de protección, o una trampa de foso mecánica, pero no revelaría una debilidad natural en el suelo, un techo inestable, o un sumidero oculto. Este hechizo simplemente revela que hay una trampa. No descubres la localización de cada una de las trampas, pero comprendes la naturaleza general del peligro que representa la trampa percibida."}, {"nombre": "Inmovilizar persona", "tipo": "nivel 2, encantamiento", "tiempo": "1 acción", "alcance": "60 pies (12 casillas, 18 m)", "componentes": "V, S, M (una pequeña pieza recta de hierro)", "duracion": "concentración, hasta 1 minuto", "desc": "Elige un humanoide que puedas ver dentro del alcance. El objetivo debe superar una tirada de salvación de Sabiduría o ser paralizado durante la duración. Al final de cada uno de sus turnos, el objetivo puede intentar otra tirada de salvación de Sabiduría. Si tiene éxito, el conjuro finaliza en el objetivo. A niveles superiores. Cuando lanzas este hechizo usando un espacio de conjuros de nivel 3 o superior, puedes elegir como objetivo a un humanoide adicional por cada nivel de espacio de conjuros por encima de nivel 2. Los humanoides deben de estar a 30 pies (6 casillas, 9 m) uno del otro cuando los selecciones."}]},
                    niveles: {

                        "Nivel 6": ["Aliado de los planos","Barrera de cuchillas","Crear muerto viviente","Dañar","Encontrar la senda","Festín de los héroes","Interdicción","Palabra de regreso","Sanar","Visión verdadera"],
