 panal y jade en polvo por valor de almenos 10 po, que el conjuro consume)", "duracion": "hasta que sea disipado", "desc": "Implantas un mensaje en un objeto dentro del alcance, un mensaje que es pronunciado cuando se da una condición desencadenante. Elige un objeto que puedas ver y que no esté siendo sujetado o transportado por otra criatura. Di entonces el mensaje, que deben ser 25 palabras o menos, pero que puede ser transmitido a lo largo de 10 minutos. Finalmente, determina la circunstancia que desencadenará el conjuro para emitir el mensaje.<br>Cuando dicha circunstancia ocurre, una boca mágica aparece en el objeto y recita el mensaje con tu voz y el mismo volumen con el que hablaste. Si el objeto que elegiste tiene una boca o algo que se parezca a una boca (por ejemplo, la boca de una estatua), la boca mágica aparece en ese lugar para que parezca que las palabras provengan de la boca del objeto. Cuando lanzas este conjuro, puedes hacer que finalice después de emitir el mensaje, o puede permanecer y repetir el mensaje siempre que el desencadenante ocurra.<br>La circunstancia desencadenante puede ser tan general o detallada como tú quieras, pero debe basarse en condiciones visuales o audibles que ocurran a 30 pies (6 casillas, 9 m) o menos del objeto. Por ejemplo, puedes dar instrucciones a la boca de hablar cuando cualquier criatura se mueva a 30 pies (6 casillas, 9 m) o menos del objeto o cuando una campana de plata tañe a 30 pies (6 casillas, 9 m) o menos de él."}, {"nombre": "Calentar metal", "tipo": "Nivel 2, transmutación", "tiempo": "1 acción", "alcance": "60 pies (12 casillas, 18 m)", "componentes": "V, S, M (una pieza de hierro y una flama)", "duracion": "Concentración, hasta 1 minuto", "desc": "Elige un objeto metálico manufacturado, como un arma de metal o una armadura metálica media o pesada, que puedas ver dentro del alcance. Provocas que el objeto comience a brillar al rojo vivo. Cualquier criatura en contacto físico con el objeto sufre 2d8 puntos de daño por fuego cuando lanzas este conjuro. Hasta que el conjuro finalice puedes usar una acción adicional en cada uno de tus subsiguientes turnos para causar este daño de nuevo.<br>Si la criatura está agarrando o portando el objeto del que toma daño, esta debe superar una tirada de salvación de Constitución o tirar el objeto si es que puede. Si no puede tirar el objeto, tiene desventaja en las tiradas de ataque y las pruebas de característica hasta el comienzo de tu siguiente turno.<br><b>A niveles superiores.</b> Cuando lanzas este hechizo usando un espacio de conjuros de nivel 3 o superior, el daño se incrementa por 1d8 por cada nivel del espacio de conjuros por encima de nivel 2."}, {"nombre": "Calmar emociones", "tipo": "Nivel 2, encantamiento", "tiempo": "1 acción", "alcance": "60 pies (12 casillas, 18 m)", "componentes": "V, S", "duracion": "Concentración, hasta 1 minuto", "desc": "Intentas suprimir emociones fuertes que afectan a un grupo de personas. Cada humanoide en una esfera de radio 20 pies (4 casillas, 6 m) centrado en un punto que elijas dentro del alcance, debe realizar una tirada de salvación de Carisma; una criatura puede elegir fallar esta tirada si así lo desea. Si la criatura falla la tirada de salvación elige uno de los dos siguientes efectos.<br>Puedes suprimir cualquier efecto que causa que el objetivo esté en estado encantado o asustado. Cuando finalice el conjuro, cualquier efecto disipado vuelve, siempre y cuando la duración de la condición no hubiera expirado antes.<br>Alternativamente, puedes hacer que un objetivo permanezca indiferente hacia criaturas de tu elección contra las que es abiertamente hostil. Esta indiferencia finaliza si el objetivo es atacado o herido directamente por un conjuro, o si es testigo de que alguno de sus amigos están siendo dañados.<br>Cuando el conjuro finaliza la criatura vuelve a ser hostil otra vez, salvo que el DM precise lo contrario."}, {"nombre": "Cautivar", "tipo": "Nivel 2, encantamiento", "tiempo": "1 acción", "alcance": "30 pies (6 casillas, 9 m)", "componentes": "V, S", "duracion": "1 minuto", "desc": "Tejes una cadena de palabras con el objetivo de distraer, provocando que criaturas de tu elección que puedas ver dentro del alcance y te puedan oír realicen una tirada de salvación de Sabiduría. Cualquier criatura que no pueda ser encantada supera esta tirada de salvación automáticamente, y si tú o tus compañeros estáis luchando contra la criatura, ésta tiene ventaja en la salvación. Con una salvación fallida, el objetivo tiene desventaja en las pruebas de Sabiduría (Percepción) realizadas para percibir cualquier criatura que no seas tú hasta que finalice el conjuro o hasta que el objetivo no pueda oírte. El conjuro finaliza si quedas incapacitado o no puedes hablar."}, {"nombre": "Ceguera/Sordera", "tipo": "Nivel 2, nigromancia", "tiempo": "1 acción", "alcance": "30 pies (6 casillas, 9 m)", "componentes": "V", "duracion": "1 minuto", "desc": "Puedes cegar o dejar sordo a un enemigo. Elige una criatura que puedas ver dentro del alcance para que realice una tirada de salvación de Constitución. Si la tirada de salvación falla, el objetivo queda cegado o ensordecido (a tu elección) durante la duración del 281 conjuro. Al final de cada turno, el objetivo puede realizar una tirada de salvación de Constitución. En caso de éxito, el conjuro finaliza.<br><b>A niveles superiores.</b> Cuando lanzas este hechizo usando un espacio de conjuros de nivel 3 o superior, puedes elegir como objetivo una criatura adicional por cada nivel de espacio de conjuros por encima de nivel 2."}, {"nombre": "Corona de la locura", "tipo": "Nivel 2, encantamiento", "tiempo": "1 acción", "alcance": "120 pies (36 casillas, 9 m)", "componentes": "V, S", "duracion": "Concentración, hasta 1 minuto", "desc": "Un humanoide de tu elección que puedas ver dentro del alcance del conjuro debe tener éxito en una tirada de salvación de Sabiduría o ser encantado por ti hasta que el conjuro finalice. Mientras el objetivo esté encantado aparece sobre su cabeza una retorcida corona de púas de hierro y un brillo de locura en sus ojos.<br>La criatura encantada debe utilizar su acción antes de mover en cada uno de sus turnos para realizar un ataque cuerpo a cuerpo contra una criatura que no sea ella misma que tú eliges mentalmente.<br>El objetivo puede actuar de forma normal en su turno si no eliges ninguna criatura o si no hay ninguna criatura a su alcance.<br>En los siguientes turnos, debes usar tu acción para mantener el control sobre el objetivo o el conjuro finaliza. El objetivo también puede realizar una tirada de salvación basada en la Sabiduría al finalizar cada uno de sus turnos. Si supera la tirada el conjuro acaba."}, {"nombre": "Detectar pensamientos", "tipo": "Nivel 2, adivinación", "tiempo": "1 acción", "alcance": "Personal", "componentes": "V, S, M (una pieza o moneda de cobre)", "duracion": "Concentración, hasta 1 minuto", "desc": "Mientras dure el conjuro, puedes leer los pensamientos de ciertas criaturas. Cuando lanzas el conjuro y como tu acción en los turnos siguientes hasta que el conjuro finalice, puedes concentrar tu mente en una criatura que puedas ver hasta 30 pies (6 casillas, 9 m) de ti. Si la criatura elegida tiene una Inteligencia de 3 o menos o no habla ninguna lengua, ésta no se ve afectada.<br>Inicialmente descubres los pensamientos superficiales de la criatura, lo que piensa en ese momento. Como una acción, puedes, o bien desplazar tu atención a los pensamientos de otra criatura, o bien sondear con mayor profundidad en la mente de la misma criatura. Si investigas más a fondo, la criatura debe realizar una tirada de salvación de Sabiduría. Si la salvación falla consigues entender su manera de razonar (si la tiene), su estado emocional, y algo que se cierne de forma notoria sobre su mente (como algo que le preocupa, ama u odia). Con una salvación con éxito, el conjuro finaliza. En cualquier caso, la criatura es consciente de que estás sondeando su mente, y a menos que desplaces tu atención a los pensamientos de otra criatura, la criatura puede usar su acción en su turno para realizar una prueba de Inteligencia enfrentada a una prueba de Inteligencia tuya; si la supera, el conjuro finaliza.<br>Las preguntas dirigidas verbalmente a la criatura objetivo moldean de forma natural el curso de sus pensamientos, por lo que este conjuro es especialmente efectivo como parte de un interrogatorio.<br>También puedes usar este conjuro para detectar la presencia de criaturas pensantes que no puedas ver. Cuando lanzas el conjuro o como una acción mientras éste dure, puedes buscar pensamientos hasta 30 pies (6 casillas, 9 m) de ti. El conjuro puede penetrar en la mayoría de barreras, pero es bloqueado por 2 pies (60 cm) de piedra, 2 pulgada (5 cm) de metal común o una delgada capa de plomo. No puedes detectar una criatura con una Inteligencia 3 o menor o una que no hable ninguna lengua.<br>Una vez detectas la presencia de una criatura de esta forma, puedes leer sus pensamientos durante el resto de la duración como se ha descrito arriba aunque no puedas verla, pero debe mantenerse en el alcance."}, {"nombre": "Estallar", "tipo": "Nivel 2, evocación", "tiempo": "1 acción", "alcance": "60 pies (12 casillas, 18 m)", "componentes": "V, S, M (un pedazo de mica)", "duracion": "Instantánea", "desc": "Un fuerte y repentino sonido resonante, dolorosamente intenso, estalla en un punto a tu elección dentro del alcance. Cada criatura que se encuentre en una esfera de 10 pies (2 casillas, 3m) de radio centrada en ese punto debe realizar una tirada de salvación de Constitución. Una criatura sufre 3d8 puntos de daño por electricidad con una tirada fracasada, o la mitad del daño en una salvación con éxito. Una criatura hecha de un material inorgánico como piedra, cristal, o metal tiene desventaja en esta tirada de salvación.<br>Un objeto no mágico que no esté sujeto ni transportado también sufre el daño si está en el área del conjuro.<br><b>A niveles superiores.</b> Cuando lanzas este hechizo usando un espacio de conjuros de nivel 3 o superior, el daño se incrementa en 1d8 por cada nivel de espacio de conjuro por encima de nivel 2."}, {"nombre": "Fuerza fantasmal", "tipo": "Nivel 2, ilusión", "tiempo": "1 acción", "alcance": "60 pies (12 casillas, 18 m)", "componentes": "V, S, M (un pedazo de vellón)", "duracion": "Concentración, hasta 1 minuto", "desc": "Confeccionas una ilusión que arraiga en la mente de una criatura que puedas ver dentro del alcance. El objetivo debe realizar una tirada de salvación de Inteligencia. Con una salvación fallida, creas un objeto, criatura u otro fenómeno visible fantasmagórico de tu elección no mayor de un cubo de 10 pies (2 casillas, 3 m) que sólo es perceptible por el objetivo mientras dure el conjuro. Este hechizo no tiene efecto en muertos vivientes o constructos.<br>La fantasmagoría incluye sonido, temperatura, y otros estímulos, evidentes sólo para la criatura también.<br>El objetivo puede usar su acción para examinar la fantasmagoría con una prueba de Inteligencia (Investigación) contra la CD de tu salvación de conjuros. Si supera la prueba, el objetivo se percata de que la fantasmagoría es una ilusión y el conjuro finaliza.<br>Mientras el objetivo está afectado por el conjuro, el objetivo trata a la fantasmagoría como si fuera real. El objetivo racionaliza cualquier respuesta ilógica derivada de tratar con la fantasmagoría. Por ejemplo, un objetivo tratando de caminar por un puente fantasmal que cubre un abismo cae una vez haya puesto un pie en el puente. Si el objetivo sobrevive a la caída, todavía piensa que el puente existe y encuentra alguna otra explicación para haber caído, le empujaron, se resbaló, o un fuerte viento lo puede haber tirado.<br>Un objetivo afectado está tan convencido de la realidad de la fantasmagoría que incluso puede recibir daño de la ilusión. Una fantasmagoría creada para parecer una criatura puede atacar al objetivo. De manera similar, una fantasmagoría creada para aparecer como fuego, un charco de ácido o lava puede quemar al objetivo. Cada asalto en tu turno, la fantasmagoría puede causar 1d6 puntos de daño psíquico al objetivo si está en el área de la fantasmagoría o si está a 5 pies (1,5 m) de la misma, siempre y cuando la ilusión sea de una criatura o peligro que pueda causar daño de forma lógica, como atacando. El objetivo percibe el daño del tipo apropiado según la ilusión."}, {"nombre": "Inmovilizar persona", "tipo": "Nivel 2, encantamiento", "tiempo": "1 acción", "alcance": "60 pies (12 casillas, 18 m)", "componentes": "V, S, M (una pequeña pieza recta de hierro)", "duracion": "Concentración, hasta 1 minuto", "desc": "Elige un humanoide que puedas ver dentro del alcance. El objetivo debe superar una tirada de salvación de Sabiduría o ser paralizado durante la duración. Al final de cada uno de sus turnos, el objetivo puede intentar otra tirada de salvación de Sabiduría. Si tiene éxito, el conjuro finaliza en el objetivo.<br><b>A niveles superiores.</b> Cuando lanzas este hechizo usando un espacio de conjuros de nivel 3 o superior, puedes elegir como objetivo a un humanoide adicional por cada nivel de espacio de conjuros por encima de nivel 2. Los humanoides deben de estar a 30 pies (6 casillas, 9 m) uno del otro cuando los selecciones."}, {"nombre": "Invisibilidad", "tipo": "Nivel 2, ilusión", "tiempo": "1 acción", "alcance": "Toque", "componentes": "V, S, M (una pequeña incrustada en goma arábiga)", "duracion": "Concentración, hasta 1 hora", "desc": "Una criatura que tocas se vuelve invisible hasta que finaliza el conjuro. Cualquier cosa que el objetivo este portando o transportando se vuelve invisible siempre que esté sobre la persona objetivo. El conjuro finaliza cuando el objetivo ataca o lanza un conjuro.<br><b>A niveles supriores.</b> Cuando lanzas este hechizo usando un espacio de conjuros de nivel 3 o superior, puedes elegir como objetivo a una criatura adicional por cada nivel de espacio de conjuros por encima de nivel 2."}, {"nombre": "Localizar animales o plantas", "tipo": "Nivel 2, adivinación (ritual)", "tiempo": "1 acción", "alcance": "Personal", "componentes": "V, S, M (una pizca de piel de un sabueso)", "duracion": "Instantánea", "desc": "Describe o nombra un tipo específico de bestia o planta. Concentrándote en la voz de la naturaleza de tus alrededores, presientes la dirección y distancia a la criatura o planta de ese tipo más cercana a menos de 5 millas (8 km), si hay alguna presente."}, {"nombre": "Localizar objeto", "tipo": "Nivel 2, adivinación", "tiempo": "1 acción", "alcance": "Personal", "componentes": "V, S, M (una rama bifurcada)", "duracion": "Concentración, hasta 10 minutos", "desc": "Describe o nombra un objeto que te sea familiar. Presientes la dirección a la ubicación del objeto, siempre que el objeto esté a menos de 1.000 pies (300 m) de ti. Si el objeto está en movimiento, conoces la dirección de su movimiento.<br>El conjuro puede encontrar objetos específicos que conoces, siempre que lo hayas visto de cerca, a menos de 30 pies (6 casillas, 9 m), al menos una vez. Alternativamente, el conjuro 319 puede localizar el objeto más cercano de un determinado tipo, como cierta clase de ropa, joyería, mobiliario, herramienta o arma.<br>El conjuro no puede encontrar a un objeto si cualquier grosor de plomo, incluso una hoja delgada, bloquea el camino directo entre ti y el objeto."}, {"nombre": "Nube de dagas", "tipo": "Nivel 2, conjuración", "tiempo": "1 acción", "alcance": "60 pies (12 casillas, 18 m)", "componentes": "V, S, M (una astilla de vidrio)", "duracion": "Concentración, hasta 1 minuto", "desc": "Llenas el aire de dagas giratorias de un cubo de 5 pies (1 casilla, 1,5 m) de lado. El cubo se crea en un punto a tu elección dentro del alcance del conjuro. Cuando una criatura entra en el área del conjuro por primera vez en un turno o comienza su turno dentro del área sufre 4d4 puntos de daño cortante.<br><b>A niveles superiores.</b> Cuando lanzas este hechizo usando un espacio de conjuros de nivel 3 o superior, el daño se incrementa en 2d4 por cada nivel de espacio de conjuros por encima de nivel 2."}, {"nombre": "Restablecimiento menor", "tipo": "Nivel 2, abjuración", "tiempo": "1 acción", "alcance": "Toque", "componentes": "V, S", "duracion": "Instantánea", "desc": "Tocas a una criatura y finalizas o bien una enfermedad o una condición que le aflija. La condición puede ser cegado, ensordecido, paralizado o envenenado."}, {"nombre": "Silencio", "tipo": "Nivel 2, ilusión (ritual)", "tiempo": "1 acción", "alcance": "120 pies (24 casillas, 36 m)", "componentes": "V, S", "duracion": "Concentración, hasta 10 minutos", "desc": "Mientras dure la duración del conjuro, ningún sonido puede ser creado dentro o pasar a través de una esfera de 20 pies (4 casillas, 6 m) de radio centrada en un punto a tu elección dentro del alcance. Cualquier criatura u objeto completamente dentro de la esfera es inmune al daño de trueno, y las criaturas están ensordecidas al entrar completamente en ella.<br>Lanzar un conjuro que requiera un componente verbal es imposible allí dentro."}, {"nombre": "Sugestión", "tipo": "Nivel 2, encantamiento", "tiempo": "1 acción", "alcance": "30 pies (6 casillas, 9 m)", "componentes": "V, M (una lengua de serpiente y una gota de aceite dulce o un trozo de panal)", "duracion": "Concentración, hasta 8 horas", "desc": "Sugieres el curso de una actividad (limitado a un par de frases) e influyes mágicamente a una criatura a la que puedas ver dentro del alcance que pueda escucharte y entenderte. Las criaturas inmunes al encantamiento son inmunes a este efecto. La sugerencia debe realizarse de manera que la acción suene razonable. Pedir a una criatura que se apuñale, se lance contra una lanza, se inmole, o haga algo obviamente dañino finaliza el conjuro al momento.<br>El objetivo debe realizar una tirada de salvación por Carisma. Si falla la salvación, intentará realizar la acción que has sugerido de la mejor manera posible. El transcurso de la acción que has sugerido continúa durante toda la duración del conjuro. Si la actividad sugerida se puede completar en menos tiempo, el conjuro finaliza cuando el sujeto termina lo que le ha sido sugerido.<br>Se pueden especificar también condiciones que activarán una actividad especial durante la duración. Por ejemplo, puedes sugerir a un caballero que entregue su caballo de guerra al primer mendigo que encuentre. Si la condición no se cumple antes de que el conjuro finalice, la actividad no es realizada.<br>Si tú o cualquiera de tus compañeros dañáis al objetivo, el conjuro finaliza."}, {"nombre": "Ver lo invisible", "tipo": "Nivel 2, adivinación", "tiempo": "1 acción", "alcance": "Personal", "componentes": "V, S, M (una pizca de talco o un poco de plata pulverizada)", "duracion": "1 hora", "desc": "Puedes ver criaturas y objetos como si fueran visibles, y puedes ver dentro del Plano Etéreo. Las criaturas etéreas y los objetos aparecen en forma espectral y son translúcidas."}, {"nombre": "Zona de verdad", "tipo": "Nivel 2, conjuración", "tiempo": "1 acción", "alcance": "60 pies (12 casillas, 24 m)", "componentes": "V, S", "duracion": "10 minutos", "desc": "Creas una zona mágica que protege contra el engaño en una esfera de 15 pies (3 casillas, 4.5. m) de radio centrado en un lugar de tu elección dentro del alcance. Hasta que el conjuro finalice, una criatura que entre en el área del conjuro por primera vez en un turno o empiece su turno allí debe realizar una tirada de salvación de Carisma. Con una salvación fracasada, la criatura no puede decir una mentira deliberada mientras esté en el radio. Tú sabes si cada criatura hace la tirada de salvación con éxito o si la falla.<br>Una criatura afectada es consciente del conjuro y por consiguiente puede evitar responder preguntas las cuales normalmente respondería con una mentira. Una criatura puede ser evasiva en sus respuestas siempre y cuando permanezca dentro del límite de la verdad."}],
                    "NIvel 3":[{"nombre": "Clarividencia", "tipo": "Nivel 3, adivinación", "tiempo": "10 minutos", "alcance": "1 milla (5280 pies, 1,6 km)", "componentes": "V, S, M (un foco de valor de 100 po, ya sea un cuerno enjoyado para escuchar o un ojo de cristal para ver)", "duracion": "Concentración, hasta 10 minutos", "desc": "Creas un sensor invisible dentro del alcance del conjuro en una localización que te sea familiar (un lugar que ya hayas visitado o visto con anterioridad) o en una localización obvia aunque no te sea familiar (por ejemplo detrás de una puerta, tras una esquina o en una arboleda). El sensor permanece ahí hasta que finalice el efecto del conjuro y no puede ser atacado, ni se puede interactuar con él.<br>Cuando lanzas este conjuro eliges si quieres ver u oír. Puedes utilizar el sentido elegido tal y como si estuvieras en la localización del sensor. En tu acción, puedes elegir cambiar el sentido utilizado entre ver y oír.<br>Una criatura que detecte el sensor (por ejemplo, aquellas criaturas que posean ver invisibilidad [see invisibility] o visión verdadera) verá un orbe luminoso e intangible del tamaño de un puño."}, {"nombre": "Crecimiento vegetal", "tipo": "Nivel 3, transmutación", "tiempo": "1 acción u 8 horas", "alcance": "150 pies (30 casillas, 45 m)", "componentes": "V, S", "duracion": "Instantánea", "desc": "Este conjuro canaliza vitalidad a las plantas dentro de un área específica. Hay dos usos posibles para este conjuro, concediendo beneficios inmediatos o a largo plazo.<br>Si lanzas el conjuro usando 1 acción, elige un punto dentro del alcance. Todas las plantas normales en un radio de 100 pies (20 casillas, 30 m) centrado en ese punto se vuelven gruesas y sobrecrecidas. Una criatura moviéndose a través del área debe gastar 4 pies (1,2 m) de movimiento por cada 1 pie (30 cm) que se mueva.<br>Puedes excluir una o más áreas de cualquier tamaño dentro del área del conjuro para que no sean afectadas.<br>Sí lanzas este conjuro durante 8 horas, enriquecerás la tierra. Todas las plantas en un radio de la mitad de 1 milla (8 Km) centrado un punto dentro del alcance, se enriquecerán por 1 año. Las plantas producirán el doble de la cantidad normal de comida cuando sean cosechadas."}, {"nombre": "Cobijo seguro de Leomund", "tipo": "Nivel 3, evocaión (ritual)", "tiempo": "1 minuto", "alcance": "Personal (un hemisferio de 10 pies [2 casillas, 3 m] de radio)", "componentes": "V, S, M (una pequeña cuenta de cristal)", "duracion": "8 horas", "desc": "Una cúpula inmóvil de fuerza de 10 pies (2 casillas, 3 m) de radio cobra existencia alrededor y por encima de ti y permanece estática mientras dura el conjuro. El hechizo termina si sales del área.<br>Nueve criaturas de tamaño mediano o menor pueden caber dentro contigo. El conjuro falla si su área incluye una criatura mayor o más de nueve criaturas. Las criaturas y objetos que se encuentren dentro de la cúpula cuando lanzas el conjuro pueden moverse por ella libremente. El resto de criaturas y objetos quedan impedidas de pasar a través de ella. Conjuros y otros efectos mágicos no se pueden extender a través de la cúpula o ser lanzados a través de ella. La atmósfera del espacio interior es confortable y seca, independientemente del tiempo en el exterior.<br>Hasta que el conjuro finalice, puedes hacer que el interior quede iluminado en luz tenue o a oscuras. La cúpula es opaca desde el exterior, del color que elijas, pero es transparente desde el interior."}, {"nombre": "Disipar magia", "tipo": "Nivel 3, abjuración", "tiempo": "1 acción", "alcance": "120 pies (24 casillas, 36 m)", "componentes": "V, S", "duracion": "Instantánea", "desc": "Elige una criatura, objeto o efecto mágico dentro del alcance. Cualquier conjuro de nivel 3 o inferior en el objetivo finaliza, Por cada conjuro de nivel 4 o superior en el objetivo, realiza una prueba de característica usando tu característica de lanzamiento de conjuros. La CD es igual a 10 + el nivel del conjuro. Con una prueba con éxito, el conjuro finaliza.<br><b>A niveles superoiores.</b> Cuando lanzas este hechizo usando un espacio de conjuros de nivel 4 o superior, finalizas automáticamente efectos de conjuros en el objetivo si el nivel del conjuro a disipar es igual o menor que el nivel del espacio de conjuros que usaste."}, {"nombre": "Don de lenguas", "tipo": "Nivel 3, adivinación", "tiempo": "1 acción", "alcance": "Toque", "componentes": "V, M (un pequeño modelo de arcilla de un zigurat)", "duracion": "1 hora", "desc": "Este conjuro concede a la criatura que toques la habilidad de entender cualquier idioma que escuche. Más allá de eso, cuando el objetivo habla, cualquier criatura que conozca al menos un idioma y que pueda oír al objetivo entiende qué está diciendo."}, {"nombre": "Fingir muerte", "tipo": "Nivel 3, necromancia (ritual)", "tiempo": "1 acción", "alcance": "Toque", "componentes": "V, S, M (un pellizco de tierra de cementerio)", "duracion": "1 hora", "desc": "Tocas a una criatura voluntaria y la induces un estado cataléptico indistinguible de la muerte.<br>Mientras dure el conjuro, o hasta que uses una acción para tocar al objetivo y cancelar el hechizo, el objetivo parece muerto a cualquier examen externo y a conjuros usado para determinar su estado. El objetivo queda cegado e incapacitado, y su velocidad se reduce a 0. El objetivo tiene resistencia a todo tipo de daño excepto psíquico. Si el objetivo está enfermo o envenenado cuando lanzas el conjuro, o si queda enfermo o envenenado mientras está bajo los efectos del hechizo, ni la enfermedad ni el veneno tienen efecto hasta que el conjuro finalice."}, {"nombre": "Glifo custodio", "tipo": "Nivel 3, abjuración", "tiempo": "1 hora", "alcance": "Toque", "componentes": "V, S, M (incienso y un diamante en polvo de un valor mínimo de 200 po, el cual será consumido por el conjuro)", "duracion": "Hasta que sea disipado o activado", "desc": "Cuando lanzas este conjuro, inscribes un glifo que hiere a otras criaturas, ya sea sobre una superficie (como una mesa o una sección del suelo o de una pared) o dentro de algún objeto que pueda ser cerrado (como un libro, un pergamino, o un cofre de tesoro) para esconder el glifo. Si eliges una superficie, el glifo puede cubrir un área de la superficie no mayor a 10 pies (2 casillas, 3 m) de diámetro. Si eliges un objeto, ese objeto debe permanecer en su sitio; si el objeto se mueve más de 10 pies (2 casillas, 3 m) de donde se lanzó el conjuro, el glifo se destruye y el conjuro finaliza sin ser activado.<br>El glifo es casi invisible y requiere una prueba de Inteligencia (Investigación) con éxito contra la CD de salvación del conjuro para ser encontrado.<br>Tú decides que activa el glifo cuando lanzas el conjuro. Para glifos inscritos en una superficie, el más típico activador incluye tocar o pararse en la superficie del glifo, quitar algún objeto que cubre al glifo, acercarse a cierta distancia del glifo, o manipular el objeto en el cual el glifo está inscrito. Para glifos inscritos en un objeto, los activadores más comunes incluyen abrir el objeto, acercarse a cierta distancia del objeto, o ver o leer el glifo. Una vez que el glifo se activa, el conjuro finaliza.<br>Puedes refinar el activador de manera que el conjuro solo se active solo bajo ciertas circunstancias o de acuerdo a características físicas (tales como la altura o el peso), tipo de criatura (por ejemplo, la protección puedes elegir que afecte aberraciones o drows), o alineamiento. Incluso puedes elegir condiciones para criaturas que no activen el glifo, como por ejemplo aquellos que digan cierta contraseña.<br>Cuando inscribas el glifo, elige entre runas explosivas o glifo de conjuro.<br><b>Runas explosivas.</b> Cuando sea activada, el glifo estalla en energía mágica en una esfera de radio de 20 pies (4 casillas, 6 m) centrado en el glifo, la esfera se expande alrededor de las esquinas. Cada criatura en el área debe realizar una tirada de salvación de Destreza. La criatura sufre 5d8 puntos de daño por ácido, frio, fuego, electricidad, o sonido con una tirada de salvación fracasada (tú eliges el tipo de daño cuando creas el glifo) o mitad de daño si supera con éxito la salvación.<br><b>Glifo de conjuro.</b> Puedes almacenar un conjuro preparado de 3er nivel o inferior en el glifo lanzándolo como parte de la creación del mismo. El conjuro debe tener como objetivo a una única criatura o un área. El conjuro almacenado no posee efecto inmediato cuando se conjura de esta manera. Cuando el glifo es activado, el conjuro almacenado se lanza. Si el hechizo tiene un objetivo, el conjuro toma como objetivo a la criatura que activo el glifo. Si el conjuro es de área, el área es centrada en la criatura. Si el conjuro convoca criaturas hostiles o crea objetos peligrosos o trampas, estas aparecen lo más cercanas posibles del intruso y lo atacan. Si el conjuro requiere concentración, este dura hasta su duración completa.<br><b>A niveles superiores.</b> Cuando lanzas este hechizo usando un espacio de conjuros de nivel 4 o superior, el daño de las runas explosivas se incrementa en 1d8 por cada nivel de espacio de conjuros por encima del nivel 3. Si creaste un glifo de conjuro, puedes almacenar cualquier conjuro del mismo nivel que del nivel del espacio de conjuro que usaste para lanzar glifo custodio."}, {"nombre": "Hablar con los muertos", "tipo": "Nivel 3, nigromancia", "tiempo": "1 acción", "alcance": "10 pies (2 casillas, 3 m)", "componentes": "V, S, M (insienso ardiendo)", "duracion": "10 minutos", "desc": "Concedes la apariencia de vida e inteligencia a un cadáver de tu elección dentro del rango, permitiéndole contestar a las preguntas que le propones. El cuerpo debe tener todavía una boca y no puede ser un muerto viviente. El conjuro falla si el cadáver fue objetivo de este mismo conjuro en los últimos 10 días.<br>Hasta que el conjuro finalice, puedes preguntarle al cuerpo hasta cinco preguntas. El cuerpo sabe tan solo aquello que conocía en vida, lo cual incluye también los idiomas. Las respuestas normalmente son breves, cripticas o repetitivas, y el cuerpo no está bajo ninguna condición de ofrecer respuestas verdaderas si eres hostil hacia él o te reconoce como un enemigo. Este conjuro no retorna el alma de la criatura a su cuerpo, solo anima su espíritu. Por lo tanto, el cuerpo no puede aprender nueva información, no comprende nada que haya sucedido desde que murió y no puede especular sobre futuros eventos."}, {"nombre": "Imagen mayor", "tipo": "Nivel 3, ilusión", "tiempo": "1 acción", "alcance": "120 pies (24 casillas, 36 m)", "componentes": "V, S, M (un pedazo de vellón)", "duracion": "Concentración, hasta 10 minutos", "desc": "Creas la ilusión visual de un objeto, una criatura o algún otro fenómeno visible que no sea mayor que un cubo de 20 pies (4 casillas, 6 m) de lado. La ilusión aparece en un lugar que puedas ver dentro del alcance. Parece completamente real, incluyendo los sonidos, olores y temperatura apropiada de la cosa mostrada. No puedes crear suficiente calor o frío para causar daño, ni un ruido lo suficientemente alto para infligir daño sónico o dejar ensordecida a una criatura, ni un olor que pueda dejar incapacitada a una criatura (como el hedor de un troglodita).<br>Mientras este dentro del alcance del conjuro, puedes usar tu acción para hacer que la ilusión se mueva hacia cualquier lugar dentro del alcance. Mientras la ilusión cambia de sitio, puedes alterar su apariencia para que así sus movimientos parezcan naturales para la imagen. Por ejemplo, si creas una imagen de una criatura y la mueves, puedes alterar la imagen para que parezca que camina. De igual modo, puedes hacer que la ilusión realice diferentes sonidos en momentos dispares, incluso manteniendo una conversación.<br>La interacción física con la imagen, revela que es una ilusión, debido a que se pasa a través de ella. La criatura que usa una acción para examinar la imagen puede determinar que es una ilusión con una prueba de Inteligencia (Investigación) contra tu CD de conjuros. Si una criatura percibe que es una ilusión, la criatura puede ver a través de la imagen, y sus otras capacidades sensoriales se vuelven irrelevantes para la criatura.<br><b>A nivles superiores.</b> Cuando lanzas este hechizo usando un espacio de conjuros de nivel 6 o superior, la duración del conjuro persiste hasta ser disipado, sin necesidad de concentración."}, {"nombre": "Indetectabilidad", "tipo": "Nivel 3, abjuración", "tiempo": "1 acción", "alcance": "Toque", "componentes": "V, S, M (una pizca de polvo de diamante por valor de almenos 25 po rociado soble el objetivo, que el conjuro consume)", "duracion": "8 horas", "desc": "Mientras dure el conjuro, escondes a un objetivo que toques de la magia de adivinación. El objetivo puede ser una criatura voluntaria o un lugar o un objeto no mayor de 10 pies (2 casillas, 3 m) en cualquier dimensión. Éste no puede ser objetivo de magia de adivinación o percibido por sensores mágicos."}, {"nombre": "Lanzar maldición", "tipo": "Nivel 3, nigromancia", "tiempo": "1 acción", "alcance": "Toque", "componentes": "V, S", "duracion": "Concentración, hasta 1 minuto", "desc": "Tocas a una criatura y dicha criatura debe superar una tirada de salvación de Sabiduría o quedará maldita durante la duración del conjuro. Cuando lanzas este conjuro, elige la naturaleza de la maldición de entre las siguientes opciones:<br>-Elige una puntuación de característica. Mientras el objetivo esté maldito tendrá desventaja en las tiradas de característica y tiradas de salvación relacionadas con la característica elegida.<br>-Mientras esté maldito, el objetivo tiene desventaja en las tiradas de ataque que realice contra ti.<br>-Mientras esté maldito, el objetivo debe realizar tiradas de salvación de Sabiduría al comienzo de cada turno. Si falla, durante su turno malgasta su acción sin hacer nada.<br>-Mientras esté maldito, tus ataques y lanzamientos de conjuros sobre el objetivo le causan un daño extra de 1d8 puntos de daño necrótico.<br>El conjuro quitar maldición finaliza este efecto. Como alternativa a lo propuesto puedes elegir un efecto diferente para la maldición que en ningún caso debería ser más poderoso que los efectos descritos anteriormente. El DM tiene la última palabra sobre el efecto propuesto.<br><b>A niveles superiores.</b> Si lanzas este hechizo usando un espacio de conjuros de nivel 4 o superior, la duración pasa a ser de concentración, hasta 10 minutos. Si usas un espacio de conjuros de nivel 5 o superior, la duración pasa a ser de 8 horas. Si usas un espacio de conjuros de nivel 7 o superior, la duración pasa a ser de 24 horas. Si usas un espacio de conjuros de nivel 9 o superior, el conjuro dura hasta que es eliminado por otros medios. Usando un espacio de conjuros de nivel 5 o superior, la duración del conjuro no requiere concentración."}, {"nombre": "Miedo", "tipo": "Nivel 3, ilusión", "tiempo": "1 acción", "alcance": "personal (cono de 30 pies [6 casillas, 9 m])", "componentes": "V, S, M (una pluma blanca o el corazón de una gallina)", "duracion": "Concentración, hasta 1 minuto", "desc": "Proyectas una imagen fantasmal de los peores miedos de una criatura. Cada criatura en un cono de 30 pies (6 casillas, 9 m) debe superar una tirada de salvación de Sabiduría o dejará caer cualquier cosa que sujete y quedará asustada mientras dure el conjuro.<br>Mientras esté asustada debido a este conjuro, la criatura debe usar la acción carrera para alejarse de ti por la ruta más segura y corta posible, a no ser que no haya ningún lugar al que moverse. Si la criatura termina su turno en un lugar en el que no tenga línea de visión contigo, puede realizar una tirada de salvación de Sabiduría. Con una salvación con éxito, el conjuro finaliza para dicha criatura."}, {"nombre": "Nube apestosa", "tipo": "Nivel 3, conjuración", "tiempo": "1 acción", "alcance": "90 pies (18 casillas, 27 m)", "componentes": "V, S, M (un huevo podrido o varias hojas de col fermentadas)", "duracion": "Concentración, hasta 1 minuto", "desc": "Creas una esfera de 20 pies (4 casillas, 6 m) de radio de un nauseabundo gas amarillo, centrada en un punto dentro del alcance del conjuro. La nube se extiende por las esquinas, y el área se oscurece profundamente. La nube se detiene en el aire durante la duración.<br>Cada criatura situada en el interior de la nube al principio de su turno debe realizar una tirada de salvación de Constitución contra venenos. Si falla la salvación, la criatura pasa su turno vomitando y bamboleándose.<br>Las criaturas que no necesitan respirar o son inmunes a los venenos superan automáticamente dicha tirada de salvación.<br>Un viento moderado (como mínimo 10 millas por hora) dispersa automáticamente la nube después de 4 asaltos. Un viento fuerte (como mínimo 20 millas por hora) la dispersa en 1 asalto."}, {"nombre": "Pauta hipnótica", "tipo": "Nivel 3, ilusión", "tiempo": "1 acción", "alcance": "120 pies (24 casillas, 36 m)", "componentes": "S, M (una vara de incienso brillante o un vial de cristal relleno de un material fosforescente)", "duracion": "Concentración, hasta 1 minuto", "desc": "Creas una sinuosa pauta de colores que serpentean en el aire en un cubo de 30 pies (6 casillas, 9 m) dentro del alcance. La pauta aparece por un momento y luego se desvanece. Cada criatura en el área que vea la pauta debe realizar una tirada de salvación de Sabiduría. En una tirada fallida, la criatura queda encantada por el resto de la duración del conjuro. Mientras esté encantada por este conjuro, la criatura esta incapacitada y su velocidad es de 0.<br>El conjuro finaliza para una criatura afectada si esta sufre cualquier daño o si alguien más usa una acción para sacudir a la criatura y sacarlo de su estupor."}, {"nombre": "Recado", "tipo": "Nivel 3, evocación", "tiempo": "1 acción", "alcance": "Ilimitado", "componentes": "V, S, M (un pequeño trozo de fino cable de cobre)", "duracion": "1 asalto", "desc": "Envías un corto mensaje de veinticinco palabras o menos a una criatura que conoces. La criatura escucha el mensaje en su mente, te reconoce como el emisor si sabe quién eres, y puede responder de igual manera inmediatamente. El conjuro permite a criaturas con una puntuación de inteligencia de al menos 1 entender el significado de tu mensaje.<br>Puedes enviar el mensaje a través de cualquier distancia e incluso a otros planos de existencia, pero si el objetivo está en un plano diferente al tuyo hay un 5 por ciento de probabilidad de que el mensaje no llegue."}],
                    "Nivel 4":[{"nombre": "Compulsión", "tipo": "Nivel 4, encantamiento", "tiempo": "1 acción", "alcance": "30 pies (6 casillas, 9 m)", "componentes": "V, S", "duracion": "Concentración, hasta 1 minuto", "desc": "Las criaturas a tu elección que puedas ver y te puedan oír dentro del alcance del conjuro deben realizar una tirada de salvación de Sabiduría. Un objetivo supera esta tirada de salvación automáticamente si no puede ser encantado. En caso de que la tirada falle, el objetivo se verá afectado por el conjuro. Hasta que el conjuro finalice, puedes utilizar una acción adicional en cada uno de tus turnos para elegir una dirección horizontal a ti. Cada objetivo afectado por el conjuro, en su siguiente turno, debe utilizar el máximo de su capacidad de movimiento para moverse en esa dirección. El objetivo puede realizar su acción antes de moverse. Después de moverse de este modo, puede realizar una tirada de salvación de Sabiduría para intentar finalizar el efecto.<br>Un objetivo no puede ser forzado a caminar hacia un peligro mortal, como por ejemplo caminar hacia el fuego o hacia un pozo, pero puede provocar ataques de oportunidad al moverse en la dirección indicada."}, {"nombre": "Confusión", "tipo": "Nivel 4, encantamiento", "tiempo": "1 acción", "alcance": "90 pies (18 casillas, 27 m)", "componentes": "V, S, M (3 cáscaras de nuez)", "duracion": "Concentración, hasta 1 minuto", "desc": "Este conjuro penetra en la mente de las criaturas y las confunde, generándoles delirios y provocándoles acciones incontroladas. Cada criatura dentro de una esfera con un radio de 10 pies (2 casillas, 3 m) centrada en un punto que elijas dentro del alcance del conjuro debe superar una tirada de salvación de Sabiduría para no verse afectada por él.<br>Una criatura afectada no puede realizar reacciones y debe tirar un d10 al comienzo de sus turnos para determinar su comportamiento a lo largo del mismo.<br><br><b>d10-Comportamiento</b><br><b>1</b> -La criatura usa todo su movimiento para moverse en una dirección aleatoria. Para determinar en qué dirección se mueve, tira 1d8 y asigna una dirección a cada cara del dado. La criatura no puede realizar ninguna acción en su turno.<br><b>2-6</b> -La criatura ni se mueve ni realiza acciones en su turno.<br><b>7-8</b> -La criatura usa su acción para realizar un ataque de cuerpo a cuerpo contra un criatura determinada aleatoriamente que esté a su alcance. Si no hay criatura cerca de ella, la criatura no hace nada en este turno.<br><b>9-10</b> - La criatura puede actuar y moverse de forma normal.<br><br>Al final de cada turno, una criatura afectada puede realizar de nuevo una tirada de salvación de Sabiduría. Si la supera, el efecto del conjuro finaliza para ella.<br><b>A niveles superiores.</b> Cuando lanzas este hechizo usando un espacio de conjuros de nivel 5 o superior, el radio de la 284 esfera crece en 5 pies (1 casillas, 1,5 m) por cada nivel de espacio de conjuros por encima de nivel 4."}, {"nombre": "Invisibilidad mayor", "tipo": "Nivel 4, ilusón", "tiempo": "1 acción", "alcance": "Toque", "componentes": "V, S", "duracion": "Concentración, hasta 1 minuto", "desc": "Tú o la criatura que toques os volvéis invisibles hasta que el conjuro finalice. Cualquier cosa que el objetivo este portando o transportando es también invisible siempre y cuando la mantenga en su persona."}, {"nombre": "Libertad de movimiento", "tipo": "Nivel 4, abjuración", "tiempo": "1 acción", "alcance": "Toque", "componentes": "V, S, M (una correa de cuero amarrada en el brazo o un miembro similar)", "duracion": "1 hora", "desc": "Tocas una a una criatura voluntaria. Durante la duración del conjuro, el movimiento del objetivo no se ve afectado por terreno difícil, otros conjuros y efectos mágicos no pueden reducir la velocidad del objetivo o causar que este sea paralizado o neutralizado.<br>El objetivo además puede utilizar 5 pies (1 casilla, 1.5 m) de movimiento para escapar automáticamente de contenciones no mágicas, como unas esposas o una criatura que la esté apresando. Finalmente, estar debajo del agua no impone penalizaciones al movimiento o ataques del objetivo."}, {"nombre": "Localizar criatura", "tipo": "Nivel 4, adivinación", "tiempo": "1 acción", "alcance": "Personal", "componentes": "V, S, M (una pizca de piel de un sabueso)", "duracion": "Concentración, hasta 1 minuto", "desc": "Describe o nombra a una criatura que te es familiar. Presientes la dirección a la ubicación de la criatura, siempre que se la criatura este a menos de 1.000 pies (300 m) de ti. Si la criatura se está en movimiento, conoces la dirección de su movimiento.<br>El conjuro puede localizar a criaturas específicas que conozcas de un cierto tipo (como un humano o un unicornio), siempre y cuando la hayas visto de cerca, a menos de 30 pies (6 casillas, 9 m), al menos una vez. Si la criatura que describes o nombras está en una forma diferente, como aquellas bajo los efectos de un conjuro de poliformia, el conjuro no puede localizar a la criatura.<br>Este conjuro no puede localizar a una criatura si una corriente de agua de al menos 10 pies (2 casillas, 3 m) de ancho se interpone en un camino directo entre la criatura y tú."}, {"nombre": "Polimorfar", "tipo": "Nivel 4, transmutación", "tiempo": "1 acción", "alcance": "60 pies (12 casillas, 18 m)", "componentes": "V, S, M (un capullo de oruga)", "duracion": "Concentración, hasta 1 hora", "desc": "Este conjuro transforma una criatura que puedas ver dentro del alcance en una forma nueva. Una criatura no voluntaria debe realizar una tirada de salvación de Sabiduría para evitar el efecto. Un cambiaformas automáticamente tendrá éxito en su tirada de salvación.<br>La transformación permanecerá mientras dure el conjuro, o hasta que el objetivo caiga a 0 Puntos de Golpe o muera. La nueva forma puede ser cualquier bestia cuyo valor de desafío sea igual o menor al del objetivo (o al nivel del objetivo si es que no tiene un valor de desafío). Las estadísticas de juego del objetivo, incluyendo las puntuaciones de características mentales, son reemplazadas por las estadísticas de la bestia elegida. Éste mantendrá su alineamiento y personalidad.<br>El objetivo asume los Puntos de Golpe de su nueva forma. Cuando revierte a su forma normal, la criatura retorna al número de Puntos de Golpe que tenía antes de ser transformada. Si se revierte como resultado debido a que sus Puntos de Golpe cayeron a 0, cualquier exceso de daño será sufrido por su forma normal. Mientras que el exceso de daño no reduzca los Puntos de Golpe a 0 de la forma normal de la criatura, esta no cae inconsciente.<br>La criatura está limitada a las acciones que puede realizar por la naturaleza de su nueva forma, y ésta no podrá hablar, lanzar conjuros o realizar cualquier otra acción que requiera manos o el habla.<br>El equipamiento del objetivo se funde en la nueva forma. La criatura no puede activar, usar, manejar u otra manera de beneficio que brinde cualquier parte de su equipo."}, {"nombre": "Puerta dimensional", "tipo": "Nivel 4, conjuración", "tiempo": "1 acción", "alcance": "500 pies (1.125 m)", "componentes": "V", "duracion": "Instantánea", "desc": "Te trasladas desde tu ubicación actual hasta otro lugar dentro del alcance. Llegas exactamente al lugar deseado.<br>Puede ser un lugar que puedes ver, uno que puedas visualizar o uno que puede describir declarando la distancia y la diracción, como 'a 200 pies (60 m) en línea recta hacia abajo' o 'hacia arriba al noroeste en un ángulo de 45 grados, a 300 pies (90 m)'.<br>Puedes llevar contigo objetos siempre que su peso no exceda tu carga máxima. También puedes llevar a una criatura voluntaria de tu tamaño o menor que este transportando equipo dentro de su capacidad de carga. La criatura debe estar a 5 pies (1 casilla, 1, 5 m) de ti cuando lanzas este conjuro.<br>Si llegases a un lugar ya ocupado por un objeto o una criatura, tú y cualquier criatura que viaje contigo sufren 4d6 puntos de daño por fuerza, y el conjuro falla en trasladarte."}, {"nombre": "Terreno alucinatorio", "tipo": "Nivel 4, ilusión", "tiempo": "10 minutos", "alcance": "300 pies (60 casillas, 100 m)", "componentes": "V, S, M (una piedra, una ramita y un pedacito de una planta verde)", "duracion": "24 horas", "desc": "Haces que un terreno natural en un cubo de 150 pies (30 casillas, 45 m) dentro del alcance se vea, suene y huela como otro tipo de terreno natural. Por lo tanto, terrenos abiertos o caminos puede ser semejantes a un pantano, una colina, una cueva u otro tipo de terreno difícil o impasable. Un estanque puede hacerse parecer a una llanura llena de pasto, un precipicio a una pendiente sueva, o un barranco pedregoso en un amplio y suave camino. Estructuras manufacturadas, equipo y criaturas en el área no pueden ser cambiados en apariencia.<br>Las características táctiles del terreno no son cambiadas, por lo que las criaturas que entran en el área es probable que se den cuenta de la ilusión. Si la diferencia no es obvia al tocarse, una criatura que examine minuciosamente la ilusión puede intentar una prueba de Inteligencia (Investigación) contra la CD de salvación del hechizo para desmentirla. Una criatura que se da cuenta de lo que es realmente la ilusión, ve una vaga imagen superpuesta sobre el terreno."}],
                    "Nivel 5":[{"nombre": "Animar los objetos", "tipo": "Nivel 5, transmutación", "tiempo": "1 acción", "alcance": "120 pies (24 casillas, 36 m)", "componentes": "V, S", "duracion": "Concentración, hasta 1 minuto", "desc": "Los objetos cobran vida a tu orden. Elige hasta diez objetos no mágicos dentro de tu alcance que no estén siendo usados o sujetos. Los objetivos de tamaño medio cuentan como dos objetos, los objetivos de tamaño grande cuentan como cuatro objetos y los objetivos de tamaño enorme cuentan como ocho objetos. No puedes animar ningún objeto de mayor tamaño que enorme. Cada objetivo elegido cobra vida y se convierte en una criatura bajo tu control hasta que el conjuro finaliza o hasta que se reduzcan sus Puntos de Golpe a 0.<br>Como acción adicional, puedes controlar mentalmente a cualquier criatura animada por este conjuro que se encuentre a menos de 500 pies (100 casillas, 150 m) de ti (si controlas múltiples criaturas, puedes dar órdenes a cualquiera de ellas o a todas ellas al mismo tiempo, emitiendo la misma orden para cada una). Tú decides que acción llevará a cabo la criatura y a donde se desplazará durante su siguiente turno, también puedes emitir una orden general, como por ejemplo vigilar una habitación concreta o un corredor. Si no emites ninguna orden, la criatura sólo actuará en defensa propia contra criaturas hostiles. Una vez que le das una orden a la criatura, ésta no para hasta completarla."}, {"nombre": "Círculo de teletransporte", "tipo": "Nivel 5, conjuración", "tiempo": "1 minuto", "alcance": "10 pies (2 casillas, 3 m)", "componentes": "V, S, M (un círculo mágico dibujado con tiza, carbón o cualquier otro material adecuado y que tenga un diámetro de al menos 10 pies (2 casillas, 3 m) y esté inscrito con símbolos arcanos)", "duracion": "1 hora", "desc": "Al lanzar este conjuro, creas un círculo mágico en el suelo en un punto dentro del alcance. El círculo es una puerta de teletransporte bidireccional. Cualquier criatura que entre en el círculo se teletransporta instantáneamente a una ubicación segura que tú hayas designado previamente. La ubicación debe estar en el mismo plano de existencia que tú y dentro del alcance del conjuro.<br>El círculo permanece abierto durante la duración del conjuro. Si deseas cerrar el círculo antes de que finalice la duración, puedes usar tu acción para hacerlo.<br><br><table><tr><th>Tamaño</th><th>PG</th><th>CA</th><th>Ataque</th><th>Fue</th><th>Des</th></tr><tr><td>Diminuto</td><td>20</td><td>18</td><td>+8 para impactar, daño 1d4 + 4</td><td>4</td><td>18</td></tr><tr><td>Pequeño</td><td>25</td><td>16</td><td>+6 para impactar, daño 1d8 + 2</td><td>6</td><td>14</td></tr><tr><td>Medio</td><td>40</td><td>13</td><td>+5 para impactar, daño 2d6 + 1</td><td>10</td><td>12</td></tr><tr><td>Grande</td><td>50</td><td>10</td><td>+6 para impactar, daño 2d10 + 2</td><td>14</td><td>10</td></tr><tr><td>Enorme</td><td>80</td><td>10</td><td>+8 para impactar, daño 2d12 +4</td><td>18</td><td>6</td></tr></table>"}, {"nombre": "Círculo de teletransporte", "tipo": "Nivel 5, conjuración", "tiempo": "1 minuto", "alcance": "10 pies (2 casillas, 3 m)", "duracion": "1 asalto", "desc": "Creas un cilindro de energía mágica de 10 pies (2 casillas, 3 m) de radio y 20 pies (4 casillas, 6 m) de altura centrado en un punto del suelo que puedas ver dentro del alcance. Runas resplandecientes aparecen allí donde el cilindro hace intersección con el suelo u otras superficies.<br>Elige uno o más de los siguientes tipos de criaturas: celestial, elemental, feérico, infernal, o muerto viviente. El círculo afecta una criatura del tipo elegido de las siguientes formas:<br>-La criatura no puede entrar voluntariamente al cilindro por medios no mágicos. Si la criatura intenta usar teletransportación o viaje intraplanar para hacerlo, primero debe superar una tirada de salvación de Carisma.<br>-La criatura tiene desventaja en las tiradas de ataque contra objetivos dentro del cilindro.<br>-Los objetivos dentro del cilindro no pueden ser encantados, asustados o poseídos por la criatura.<br>Cuando lanzas este conjuro, puedes elegir causar que su magia opere en el sentido inverso, previniendo que una criatura del 282 tipo elegido abandone el cilindro y protegiendo a los objetivos fuera del mismo.<br><b>A niveles superiores.</b> Cuando lanzas este hechizo usando un espacio de conjuros de nivel 4 o superior, la duración se incrementa en 1 hora por cada nivel de espacio de conjuros por encima de nivel 3."}, {"nombre": "Conocimiento de leyendas", "tipo": "Nivel 5, adivinación", "tiempo": "10 minutos", "alcance": "Personal", "componentes": "V, S, M (incienso por valor de al menos 250 po, que el conjuro consume, y cuatro tiras de marfil por valor de al menos 50 po cada una)", "duracion": "Instantánea", "desc": "Nombra o describe a una persona, lugar u objeto. El conjuro trae a tu mente un breve resumen de la sabiduría popular acerca de lo que nombraste. El conocimiento puede consistir en cuentos actuales, historias olvidadas, e incluso saberes secretos que nunca han sido ampliamente conocidos. Si la cosa que nombras no tiene una importancia propia de leyendas, no consigues información. Mientras más información ya poseas acerca de la cosa, más precisa y detallada será la nueva información recibida.<br>La información que descubres en rigurosa pero puede estar expresada en lenguaje figurativo. Por ejemplo, si tienes un hacha misteriosa en la mano, el conjuro puede dar esta información: 'Información para el malhechor que toca el hacha, pues hasta la empuñadora rebana la mano de los malvados. Sólo un verdadero Hijo de la Piedra, amante y amado de Moradin, podría despertar los verdaderos poderes del hacha, solo con la sagrada palabra Rudnogg en los labios.'"}, {"nombre": "Curar heridas en masa", "tipo": "Nivel 5, conjuración", "tiempo": "1 acción", "alcance": "60 pies (12 casillas, 18 m)", "componentes": "V, S", "duracion": "Instantánea", "desc": "Una oleada de energía sanadora se extiende desde un punto a tu elección dentro del alcance. Elige hasta a seis criaturas en una esfera de 30 pies (6 casillas, 9 m) de radio centrada en ese punto. Cada objetivo recupera Puntos de Golpe igual a 3d8 + tu modificador de característica de lanzamiento de conjuros. El conjuro no tiene efecto sobre muertos vivientes o constructos.<br><b>A niveles superiores.</b> Cuando lanzas este hechizo usando un espacio de conjuros de nivel 6 o superior, la curación se incrementa en 1d8 por cada nivel de espacio de conjuros por encima de nivel 5."}, {"nombre": "Doble engañoso", "tipo": "Nivel 5, ilusión", "tiempo": "1 acción", "alcance": "Personal", "componentes": "S", "duracion": "Concentración, hasta 1 hora", "desc": "Te vuelves invisible al mismo tiempo que un doble ilusorio de ti aparece dónde estés. El doble permanece mientras dure el conjuro, pero la invisibilidad termina si atacas o lanzas un conjuro.<br>Puedes usar tu acción para mover al doble ilusorio hasta dos veces tu velocidad y realizar gestos, hablar y comportarse de la manera que elijas.<br>Puedes ver a través de sus ojos y oír a través de sus oídos como si estuvieras donde está él. En cada uno de tus turnos, como una acción adicional, puedes cambiar de usar sus sentidos a usar los tuyos, o volver a los suyos. Mientras usas sus sentidos, tú estás cegado y ensordecido respecto a tu propio entorno."}, {"nombre": "Dominar persona", "tipo": "Nivel 5, encantamiento", "tiempo": "1 acción", "alcance": "60 pies (12 casillas, 18 m)", "componentes": "V, S", "duracion": "Concentración, hasta 1 minuto", "desc": "Intentas controlar a un humanoide que puedes ver dentro del alcance. Debe superar una tirada de salvación de Sabiduría o quedar encantado mientras dure el conjuro. Si tú o criaturas aliadas contigo estáis luchando contra él, posee ventaja en la tirada de salvación.<br>Mientras la criatura está encantada, posees un vículo telepático con ella mientras los dos estéis en el mismo plano de existencia. Puedes utilizar este vínculo teleático para darle órdenes a la criatura humanoide mientras estéis consciente (no se exige acción) que hace todo lo posible por obedecer. Puedes especificar un curso de acción sencillo y general, como 'Ataca a esa criatura','Corre hasta aquí' o 'Esquiva ese objeto'. Si la criatura cumple ka órden y no recibe mán indicacionespor tu parte, se defiende y cuida de sí mismo lo mejor que puede.<br>Puedes utilizar tu acción para tomar un control total y preciso del objetivo. Hasta el final de tu siguiente turno, la criatura solo realiza acciones que tu elijas, y no hace nada que no le permitas hacer. Durante este tiempo, también puede hacer que la criatura utilice una reacción, pero esto exige que también utilices tu propia reacción. Cada vez que el objetivo sufra daño, realiza una tirada de salvación de Sabiduría nueva contra el conjuro. Si la tirada de salvación tiene éxito, el conjuro finaliza.<br><b>A niveles superiores.</b> Cuando lanzas este hechizo usando un espacio de conjuros de nivel 6, la duración es concentración, hasta 10 minutos. Cuando lanzas este hechizo usando un espacio de conjuros de nivel 7, la duración es concentración, hasta 1 hora. Cuando lanzas este hechizo usando un espacio de conjuros de nivel 8, la duración es concentración, hasta 8 horas."}, {"nombre": "Dotar de consciencia", "tipo": "Nivel 5, transmutación", "tiempo": "8 horas", "alcance": "Toque", "componentes": "V, S, M (un ágata valorada en al menos 1.000 po, que el conjuro consume)", "duracion": "Instantánea", "desc": "Después de consumir el tiempo de lanzamiento necesario trazando señales mágicas con la piedra preciosa, tocas a una bestia o planta sin limitación de tamaño. El objetivo no debe tener inteligencia o tener una puntuación de 3 o inferior. En ese momento, el objetivo adquiere una inteligencia de 10. También adquiere la capacidad de hablar un lenguaje que tú sepas. Si el objetivo es una planta, ganará la habilidad de mover sus extremidades, raíces, ramas, enredaderas, etcétera, ganando sentidos similares a los de un ser humano. Tu DM elige las estadísticas apropiadas para la planta despertada, por ejemplo las estadísticas de un arbusto o un árbol.<br>La bestia o planta despertada permanecerá encantada por ti durante 30 días o hasta que tú o cualquiera de tus compañeros le inflija algún daño. Cuando la condición de encantada se desvanece, la criatura despertada podrá elegir si sigue siendo o no amiga tuya dependiendo del trato que le hayas dado mientras estaba encantada."}, {"nombre": "Escudriñamiento", "tipo": "Nivel 5, adivinación", "tiempo": "10 minutos", "alcance": "Personal", "componentes": "V, S, M (un foco con un valor de al menos 1.000 po, tal como una bola de cristal, un espejo de plata o un pila llena de agua bendita)", "duracion": "Concentración, hasta 10 minutos", "desc": "Puedes ver y oír a una criatura a tu elección que esté en el mismo plano de existencia que tú. El objetivo debe hacer una tirada de salvación de Sabiduría, que se verá modificada por cómo de bien conoces al objetivo y el tipo de conexiones físicas que tienes con él. Si un objetivo sabe que estás lanzando este conjuro, puede fallar la tirada de salvación voluntariamente si quiere ser observado.<br>Con una tirada de salvación con éxito, el objetivo no se ve afectado y tú no podrás volver a usar este conjuro contra él otra vez durante 24 horas.<br>Con una tirada de salvación fracasada, el conjuro crea un sensor invisible a un alcance de 10 pies (2 casillas, 3 m) del objetivo. Puedes ver y escuchar a través del sensor como si estuvieras allí. El sensor se mueve con el objetivo, manteniéndose a 10 pies (2 casillas, 3 m) de él durante la duración del conjuro. Una criatura que pueda ver objetos invisibles puede ver el sensor como un orbe luminoso de aproximadamente el tamaño de un puño.<br>En vez de seleccionar una criatura, puedes escoger un lugar que hayas visto anteriormente como objetivo para este conjuro. Cuando lo haces, el sensor aparece en ese lugar y no se mueve.<br><br><table><tr><th>Conocimiento</th><th>Modificador de Salvación</th></tr><tr><td>Segunda mano (has oído del objetivo)</td><td>+5</td></tr><tr><td>Primera mano (has conocido al objetivo)</td><td>+0</td></tr><tr><td>Familiar (conoces bien al objetivo)</td><td>-5</td></tr><tr><th>Conexión</th><th>MOdificador de Salvación</th></tr><tr><td>Retrato o fotografía</td><td>-2</td></tr><tr><td>Posesión de una prenda</td><td>-4</td></tr><tr><td>Parte del cuerpo, mechón o pelo, trozo de uña o similar</td><td>-10</td></tr></table>"}, {"nombre": "Geas", "tipo": "Nivel 5, encantamiento", "tiempo": "1 minuto", "alcance": "60 pies (12 casillas, 18 m)", "componentes": "V", "duracion": "30 días", "desc": "Colocas una orden mágica en una criatura que puedas ver dentro del alcance, forzándola a ofrecerte algún servicio o abstenerse de alguna actividad o curso de acción a tu decisión. Si la criatura puede entenderte debe realizar una tirada de salvación con éxito de Sabiduría o quedar encantada por la duración del conjuro. Mientras la criatura se encuentre encantada por ti, esta sufre 5d10 puntos de daño psíquico cada vez que actué de una manera directamente opuesta a tus instrucciones, pero no más de una vez cada día. Una criatura que no pueda entenderte no se ve afectada por este conjuro.<br>Puedes emitir una orden a tu elección, que no implique en una actividad que pueda resultar en una muerte cierta. En caso de emitir una orden suicida, el conjuro finaliza.<br>Puedes finalizar el conjuro usando una acción para cancelarlo. Un conjuro de quitar maldición, restablecimiento mayor, o deseo también finaliza este conjuro.<br><b>A niveles superiores.</b> Cuando lanzas este hechizo usando un espacio de conjuros de nivel 7 u 8, la duración es de un año. Cuando lanzas este hechizo usando un espacio de conjuros de nivel 9, el conjuro se mantiene hasta que sea finalizado por cualquiera de los conjuros mencionados arriba."}, {"nombre": "Inmovilizar monstruo", "tipo": "Nivel 5, encantamiento", "tiempo": "1 acción", "alcance": "90 pies (18 casillas, 27 m)", "componentes": "V, S, M (una pequeña pieza recta de hierro)", "duracion": "Concentración, hasta 1 minuto", "desc": "Elige a una criatura que puedas ver dentro del alcance. El objetivo debe superar una tirada de salvación de Sabiduría o ser paralizada durante la duración del conjuro. Este conjuro no tiene efecto en muertos vivientes. Al final de cada uno de sus turnos, el objetivo puede intentar otra tirada de salvación de Sabiduría. Si tiene éxito, el conjuro finaliza en el objetivo.<br><b>A niveles superiores.</b> Cuando lanzas este hechizo usando un espacio de conjuros de nivel 6 o superior, puedes elegir como objetivo una criatura adicional por cada nivel de espacio de conjuros por encima de nivel 5. Las criaturas deben de estar a 30 pies (6 casillas, 9 m) una de la otra cuando las selecciones."}, {"nombre": "Ligadura de los planos", "tipo": "Nivel 5, abjuración", "tiempo": "1 hora", "alcance": "Toque", "60 pies (12 casillas, 18 m)": "V, S, M (una joya por valor de al menos 1.000 po, que el conjuro consume)", "duracion": "24 horas", "desc": "Con este conjuro, intentas ligar a un celestial, elemental, ser feérico, o a un demonio a tu servicio. La criatura debe estar dentro del alcance durante el lanzamiento completo del conjuro (típicamente, la criatura es primero invocada en el centro de un círculo mágico invertido con el fin de mantenerlo atrapado mientras que este conjuro es lanzado). Al completarse el lanzamiento, el objetivo debe realizar una tirada de salvación de Carisma. Con una salvación fracasada, estará ligada a servirte durante la duración del conjuro. Si la criatura fue invocada o creada por otro conjuro, la duración de ese conjuro es extendida para concordar con la duración de este conjuro.<br>Una criatura ligada debe seguir tus instrucciones con lo mejor de su capacidad. Puedes ordenar a la criatura a acompañarte en una aventura, proteger una posición o entregar un mensaje. La criatura te obedece al pie de la letra, pero si la criatura es hostil hacia ti, se esforzará por tergiversar tus palabras para alcanzar sus propios objetivos. Si la criatura lleva a cabo completamente tus instrucciones antes de que el conjuro finalice, viajará hacia ti para reportar este hecho si estas en el mismo plano de existencia. Si estas en un plano de existencia diferente, la criatura retornará al lugar donde la ligaste y permanecerá allí hasta que el conjuro finalice.<br><b>A niveles superiores.</b> Cuando lanzas este hechizo usando un espacio de conjuros de un nivel superior, la duración se incrementa en 10 días con un espacio de nivel 6, a 30 días con un espacio de nivel 7, a 180 días con un espacio de nivel 8, y a un año y un día con un espacio de conjuros de nivel 9."}, {"nombre": "Mensaje onírico", "tipo": "Nivel 5, ilusión", "tiempo": "1 minuto", "alcance": "Especial", "componentes": "V, S, M (un puñado de arena, una gota de tinta y una pluma para escribir arrancada de un pájaro durmiendo)", "duracion": "8 horas", "desc": "Este conjuro moldea los sueños de una criatura. Elige una criatura que conozcas como el objetivo de este conjuro. El objetivo debe estar en el mismo plano de existencia que tú. A las criaturas que no duermen, como los elfos, no se las puede contactar con este conjuro. Tú, o una criatura voluntaria que toques, entráis en un estado de trance, actuando como un mensajero. Mientras está en trance, el mensajero está al tanto de todo a su alrededor, pero no puede llevar a cabo acciones o moverse.<br>Si el objetivo está dormido, el mensajero aparece en los sueños del objetivo y puede hablar con el objetivo mientras permanezca dormido y mientras dure el conjuro. El mensajero también puede moldear el entorno del sueño, creando paisajes, objetos y otras imágenes. El mensajero puede salir del trance en cualquier momento, terminado antes el efecto del conjuro. Tras despertarse el objetivo recuerda el sueño perfectamente.<br>Si el objetivo está despierto cuando lanzas el conjuro, el mensajero lo sabe, y puede o bien terminar el trance (y el conjuro) o esperar a que el objetivo se quede dormido, momento en el cual el mensajero aparece en los sueños del objetivo.<br>Puedes hacer que el mensajero aparezca de forma monstruosa y terrible para el objetivo. Si lo haces, el mensajero no puede entregar un mensaje de más de diez palabras y luego el objetivo debe realizar una tirada de salvación de Sabiduría. Con una salvación fracasada, los recuerdos de la monstruosidad fantasmal le producen al objetivo pesadillas que le duran todo su sueño y le impiden obtener cualquier beneficio por descansar. Además, cuando el objetivo se levante, sufre 3d6 puntos de daño psíquico.<br>Si posees una parte del cuerpo, un mechón de pelo, trozos de uñas cortadas o una parte parecida del cuerpo del objetivo, el objetivo deben realizar su tirada de salvación con desventaja."}, {"nombre": "Modificar recuerdo", "tipo": "Nivel 5, encantamiento", "tiempo": "1 acción", "alcance": "30 pies (6 casillas, 9 m)", "componentes": "V, S", "duracion": "Concentración, hasta 1 minuto", "desc": "Tratas de moldear los recuerdos de otra criatura. Una criatura que puedas ver debe realizar una tirada de salvación de Sabiduría. Si estas combatiendo con la criatura, ésta tiene ventaja en la tirada de salvación. Con una salvación fracasada, el objetivo queda encantado por ti mientras dure el conjuro. El objetivo encantado está incapacitado y no es consciente de su entorno, pero puede oírte. Si sufre daño o es objetivo de otro conjuro, este conjuro finaliza, y ningún recuerdo del objetivo es modificado.<br>Mientras el encantamiento dure, puedes afectar a la memoria del objetivo sobre un evento que haya experimentado en las últimas 24 horas y que no durase más de 10 minutos. Puedes eliminar permanentemente todo recuerdo del evento, permitir al objetivo recordar el evento con una claridad perfecta y detalles exactos, cambiar los recuerdos de los detalles, o crear un recuerdo de otro evento.<br>Debes hablarle al objetivo para describir cómo sus recuerdos quedan afectados, y debe ser capaz de entender la lengua que uses para que los recuerdos modificados arraiguen. Su mente rellena posibles huecos que dejen los detalles de tu descripción. Si el conjuro finaliza antes de que hayas acabado de describir los recuerdos modificados, la memoria de la criatura no queda alterada. De otra forma, los recuerdos modificados quedan establecidos cuando el conjuro finaliza.<br>Una memoria modificada no necesariamente afecta a cómo se comporta la criatura, particularmente si la memoria contradice las inclinaciones naturales de la criatura, su alineamiento, o creencias. Un recuerdo modificado ilógico, como implantar un recuerdo de cuánto la criatura disfrutaba empapándose de ácido, es cancelado, quizá como un mal sueño. El DM puede considerar un recuerdo modificado como demasiado absurdo para que afecte a la criatura de un modo significativo.<br>Un conjuro de quitar maldición o restablecimiento mayor lanzado sobre el objetivo restaura la verdadera memoria de la criatura.<br><b>A niveles superiores.</b> Cuando lanzas este hechizo con un espacio de conjuros de nivel 6 o superior, puedes alterar los recuerdos del objetivo de un evento que tuviera lugar hasta 7 días atrás (nivel 6), 30 días atrás (nivel 7), 1 año atrás (nivel 8), o cualquier momento en el pasado de la criatura (nivel 9)."}, {"nombre": "Revivir a los muertos", "tipo": "Nivel 5, nigromancia", "tiempo": "1 hora", "alcance": "Toque", "componentes": "V, S, M (un diamante valorado en al menos 500 po, que el conjuro consume)", "duracion": "Instantánea", "desc": "Devuelves a una criatura muerta que tocas a la vida, siempre que no haya estado muerta más de 10 días. Sí el alma de la criatura es tanto voluntaria como libre para volver a reunirse con el cuerpo, la criatura regresará a la vida con 1 punto de golpe.<br>Este conjuro además neutraliza cualquier veneno y cura enfermedades no mágicas que afectaron a la criatura en el momento de su muerte. Sin embargo, este conjuro no elimina enfermedades mágicas, maldiciones o efectos similares; si éstos no son eliminados previamente a lanzar el conjuro, estos toman efecto cuando la criatura retorna a la vida. El conjuro no puede devolver a una criatura muerto viviente a la vida.<br>Este conjuro cierra todas las heridas mortales, pero no devuelve partes faltantes del cuerpo. Si a la criatura le faltan partes integrales de su cuerpo, su cabeza por ejemplo, el conjuro falla automáticamente.<br>Regresar de la muerte es una experiencia dura. El objetivo sufre un penalizador de -4 en todas las tiradas de ataque, de salvación y pruebas de característica. Cada vez que realice un descanso prolongado, el penalizador se reduce en 1 hasta que desaparece."}, {"nombre": "Similitud", "tipo": "Nivel 5, ilusión", "tiempo": "1 acción", "alcance": "30 pies (6 casillas, 9 m)", "componentes": "V, S", "duracion": "8 horas", "desc": "Este conjuro te permite cambiar la apariencia de cualquier número de criaturas que puedas ver dentro del alcance. Le das a cada objetivo que elijas una nueva apariencia ilusoria. Un objetivo que no sea voluntario puede hacer una tirada de salvación de Carisma y no se verá afectado por el conjuro si tiene éxito.<br>El conjuro disfraza la apariencia física así como ropa, armadura, armas y equipo. Puedes hacer que cada criatura parezca 1 pie (30 cm) más alta o baja, así como parecer delgadas, gordas o algo intermedio. No puedes cambiar el tipo de cuerpo del objetivo, así que debes escoger una forma que tenga la misma distribución de extremidades. Sin embargo, la extensión de la ilusión es cosa tuya. El conjuro permanecerá activo toda su duración a no ser que uses tu acción para cancelarlo antes.<br>Los cambios originados por este conjuro no serán capaces de superar una inspección física. Por ejemplo, si usas este conjuro para añadir un sombrero al atuendo de una criatura, los objetos pasan a través del sombrero, y cualquiera que lo toque no notará nada o notará la cabeza o pelo de la criatura. Si usas este 343 conjuro para parecer más delgado de lo que eres, la mano de alguien alcance a tocarte se chocará contra ti mientras aparenta estar en medio del aire.<br>Una criatura puede usar su acción para inspeccionar un objetivo y hacer una prueba de Inteligencia (Investigación) contra el CD de tu conjuro. Si tiene éxito se da cuenta de que el objetivo está disfrazado."}],                 
                    },
                    niveles: {
                        "Trucos (Nivel 0)": ["Amigos","Burla cruel","Cuchilla protectora","Impacto verdadero","Ilusión menor","Luz","Luces danzantes","Mano de mago","Mensaje","Prestidigitación","Remendar"],
