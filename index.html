                {
                    nombre: "Druida",
                    icon: "🌿",
                    conjurosDetalle: {"Truco (Nivel 0)": [{"nombre": "Flamear", "tipo": "truco, conjuración", "tiempo": "1 acción", "alcance": "personal", "componentes": "V, S", "duracion": "10 minutos", "desc": "Una fluctuante llama aparece en tu mano. La llama permanece allí mientras dure el conjuro y no te hiere a ti ni a tu equipo. La llama despide luz brillante en un radio de 10 pies (2 casillas, 3 m) y luz tenue en 10 pies (2 casillas, 3 m) adicionales. El conjuro finaliza si tú lo cancelas como una acción o si lo lanzas de nuevo. También puedes atacar con la llama, pero al hacerlo finaliza el conjuro. Cuando lanzas este conjuro, o como una acción en un turno posterior, puedes lanzar la llama a una criatura dentro de 30 pies (6 casillas, 9 m) de ti. Realiza una tirada de ataque de conjuro a distancia. Con un impacto, el objetivo sufre 1d8 puntos de daño por fuego. El daño de este conjuro se incrementa en 1d8 cuando alcanzas el nivel 5 (2d8), nivel 11 (3d8), y nivel 17 (4d8)"}, {"nombre": "Garrote", "tipo": "truco, transmutación", "tiempo": "1 acción adicional", "alcance": "toque", "componentes": "V, S, M (muérdago, una hoja de trébol, y un garrote o bastón)", "duracion": "1 asalto", "desc": "La madera de un garrote o bastón que estás portando es imbuida con el poder de la naturaleza. Mientras el conjuro permanezca activo, puedes usar tu característica de lanzamiento de conjuros en vez de la Fuerza para las tiradas de ataque y daño de ataques cuerpo a cuerpo usando esa arma, y el dado de daño del arma se convierte en 1d8. El arma también se vuelve mágica, si no lo era 307 anteriormente. El conjuro finaliza si lanzas otro conjuro o si sueltas el arma."}, {"nombre": "Látigo de espinas", "tipo": "truco, transmutación", "tiempo": "1 acción", "alcance": "30 pies (6 casillas, 9 m)", "componentes": "V, S, M (la semilla de una planta con espinas)", "duracion": "instantánea", "desc": "Creas un látigo de espinas mágico que se extiende desde tu mano. El látigo es un arma cuerpo a cuerpo que inflige 1d6 puntos de daño perforante y tiene la propiedad de ser ligera. El alcance del látigo es de 10 pies (2 casillas, 3 m) y puedes usarlo para atacar a distancia. El daño del látigo se incrementa en 1d6 cuando alcanzas el nivel 5 (2d6), nivel 11 (3d6), y nivel 17 (4d6). El conjuro finaliza si lo lanzas de nuevo o si tu concentración se rompe."}, {"nombre": "Magia druídica", "tipo": "truco, transmutación", "tiempo": "1 acción", "alcance": "30 pies (6 casillas, 9 m)", "componentes": "V, S", "duracion": "Instantánea", "desc": "Susurrando a los espíritus de la naturaleza, creas uno de los efectos siguientes dentro del alcance: - Creas un pequeño efecto sensorial inofensivo que predice el clima que hará en tu ubicación durante las próximas 24 horas. El efecto se puede manifestar como un orbe dorado para cielos despejados, una nube para lluvia, copos de nieve cayendo para nieve, y similares. El efecto permanece 1 turno. - Instantáneamente haces que una flor florezca, una vaina con semillas se abra o que un capullo brote. - Creas un efecto sensorial instantáneo e inofensivo, como hojas cayendo, un soplo de viento, el sonido de un pequeño animal o un leve olor a mofeta. El efecto debe ocupar como máximo un cubo de 5 pies (1 casilla, 1,5 m). - Puedes encender o apagar instantáneamente una vela, una antorcha o una pequeña fogata."}, {"nombre": "Orientación divina", "tipo": "truco, adivinación", "tiempo": "1 acción", "alcance": "toque", "componentes": "V, S", "duracion": "concentración, hasta 1 minuto", "desc": "Tocas una criatura voluntaria. Antes de que el conjuro finalice el objetivo puede lanzar un d4 y agregar el resultado a una prueba de característica que el elija. Puede tirar el dado antes o después de realizar su prueba de característica. El conjuro entonces finaliza."}, {"nombre": "Remendar", "tipo": "truco, transmutación", "tiempo": "1 minuto", "alcance": "toque", "componentes": "V, S, M (2 calamitas)", "duracion": "instantánea", "desc": "Este conjuro repara una única rotura o rasgadura en un objeto que toques, como un eslabón roto de una cadena, dos mitades de una llave rota, una capa desgarrada, o un odre con filtraciones. Siempre y cuando la rotura o rasgadura no sea mayor de 1 pie (30 cm) en cualquier dimensión, la arreglas, y no queda rastro alguno del daño anterior. Este conjuro puede reparar físicamente un objeto mágico o a un constructo, pero el conjuro no puede restaurar la magia a objetos de dicho tipo."}, {"nombre": "Resistencia", "tipo": "truco, abjuración", "tiempo": "1 acción", "alcance": "toque", "componentes": "V, S, M (una capa en miniatura)", "duracion": "concentración, hasta 1 minuto", "desc": "Tocas a una criatura voluntaria. Antes de que el conjuro finalice, el objetivo puede tirar 1d4 y añadir el número del resultado a una tirada se salvación de su elección. Puede tirar el dado antes o después de hacer la tirada de salvación. Luego el conjuro finaliza."}, {"nombre": "Rociada de veneno", "tipo": "truco, conjuración", "tiempo": "1 acción", "alcance": "10 pies (2 casillas, 3 m)", "componentes": "V, S", "duracion": "instantánea", "desc": "Extiendes tu mano hacia una criatura que puedas ver dentro del alcance y proyectas un soplido de gas nocivo desde tu palma. La criatura debe superar una tirada de salvación de Constitución o sufrir 1d12 puntos de daño por veneno. El daño de este conjuro se incrementa en 1d12 cuando alcanzas el nivel 5 (2d12), nivel 11 (3d12) y nivel 17 (4d12)."}],
                    "Nivel 1": [{"nombre": "Amistad con los animales", "tipo": "nivel 1, encantamiento", "tiempo": "1 acción", "alcance": "30 pies (6 casillas, 9 m)", "componentes": "V, S, M (un bocado de comida)", "duracion": "24 horas", "desc": "Este conjuro permite convencer a una bestia de que no vas a hacerle daño. Elige una bestia que puedas ver dentro del alcance del conjuro. Ella también debe verte y escucharte. Si la inteligencia de la bestia es 4 o más, el conjuro falla automáticamente. Si no, la bestia debe superar una tirada de salvación de Sabiduría o es encantada por ti durante la duración del conjuro. Si alguno de tus compañeros o tú hace daño a la bestia, el conjuro también finaliza.<br><b>A niveles superiores.</b> Cuando lanzas este hechizo usando un espacio de conjuros de nivel 2 o superior, puedes afectar a una bestia adicional por cada nivel de espacio de conjuros por encima de nivel 1."}, {"nombre": "Buenas bayas", "tipo": "nivel 1, transmutación", "tiempo": "1 acción", "alcance": "toque", "componentes": "V, S, M (ramita de muérdago)", "duracion": "instantánea", "desc": "Hasta diez bayas aparecen en tu mano las cuales están infundidas con magia por toda la duración del conjuro. Una criatura puede usar su acción para comer una baya. Comerse una baya recupera 1 punto de golpe, y la baya provee suficiente nutrientes para mantener a una criatura durante un día.<br>Las bayas pierden su potencial si estas no han sido consumidas en las 24 horas después de que el conjuro fue lanzado."}, {"nombre": "Crear o destruir agua", "tipo": "nivel 1, transmutación", "tiempo": "1 acción", "alcance": "30 pies (6 casillas, 9 m)", "componentes": "V, S, M (una gota de agua si quieres crear o unos pocos granos de arena si quieres destruir)", "duracion": "instantanea", "desc": "Puedes crear o destruir agua.<br><b>Crear agua.</b> Creas 10 galones (37 litros) de agua limpia en un recipiente que se encuentra dentro del alcance del conjuro. Alternativamente, el agua cae como lluvia en un cubo de 30 pies cuadrados (6 casillas, 9 m), extinguiendo las llamas que puede haber en ese área.<br><b>Destruir agua.</b> Destruyes 10 galones (37 litros) de agua que se encuentre en un recipiente situado dentro del alcance del conjuro. Alternativamente, destruyes niebla en un cubo cuadrado de 30 pies (6 casillas, 9 m) dentro del alcance del conjuro.<br><b>A niveles superiores.</b> Cuando lanzas este hechizo usando un espacio de conjuros de nivel 2 o superior, puedes crear o destruir 10 galones (37 litros) de agua adicionales, o aumentar en 5 pies (1 casillas, 1,5 m) el tamaño del cubo, por cada nivel de espacio de conjuros por encima de nivel 1."}, {"nombre": "Curar heridas", "tipo": "Nivel 1, evocación", "tiempo": "1 acción", "alcance": "Toque", "componentes": "V, S", "duracion": "Instantánea", "desc": "Una criatura que tocas recupera un número de Puntos de Golpe igual a 1d8 + tu modificador de característica para lanzar conjuros. Este conjuro no tiene efecto sobre muertos vivientes o constructos.<br><b>A niveles superiores.</b> Cuando lanzas este hechizo usando un espacio de conjuros de nivel 2 o superior, la curación se incrementa en 1d8 por cada nivel de espacio de conjuros por encima de nivel 1."}, {"nombre": "Detectar magia", "tipo": "Nivel 1, adivinación (ritual)", "tiempo": "1 acción", "alcance": "Personal", "componentes": "V, S", "duracion": "Concentración, hasta 10 minutos", "desc": "Mientras dura el conjuro, sientes la presencia de la magia a menos de 30 pies (6 casillas, 9 m) de ti. Si sientes magia de esta forma, puedes utilizar tu acción para ver un aura débil alrededor de cualquier criatura u objeto visibles en al área que posee magia, y averiguar su escuela de magia, si existe.<br>El conjuro puede penetrar en la mayoría de barreras, pero es bloqueado por 1 pie (30 cm) de piedra, 1 pulgada (2,54 cm) de metal común, una delgada capa de plomo o 3 pies (90 cm) de madera o suciedad."}, {"nombre": "Detectar venenos y enfermedades", "tipo": "nivel 1, adivinación (ritual)", "tiempo": "1 acción", "alcance": "personal", "componentes": "V, S, M (una hoja de tejo)", "duracion": "concentración, hasta 10 minutos", "desc": "Mientras dure el conjuro, notas la presencia y localización de venenos, criaturas venenosas y enfermedades hasta a 30 pies (6 casillas, 9 m) de ti. También identificas el tipo de veneno, criatura venenosa o enfermedad en cada caso.<br>El conjuro puede penetrar en la mayoría de barreras, pero es bloqueado por 1 pie (30 cm) de piedra, 1 pulgada (2,5 cm) de metal común, una delgada capa de plomo o 3 pies (90 cm) de madera o suciedad."}]},

        const normalizeStr = str => str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

        function renderSection(category) {
            // Update Active Nav
            document.querySelectorAll('#nav-menu button').forEach(btn => btn.classList.remove('active'));

                <div id="section-results"></div>
            `;
            contentArea.innerHTML = html;

            const localSearch = document.getElementById('local-search');
            const resultsArea = document.getElementById('section-results');

            function updateResults(query) {
                const data = database[category];
                const filteredData = data.filter(item => {
                    if (!query) return true;
                    // Para Conjuros solo buscar por nombre para evitar stringify de objetos grandes
                    if (category === "Conjuros") {
                        return normalizeStr(item.nombre).includes(normalizeStr(query));
                    }
                    // Búsqueda profunda en los valores del objeto (útil para el HTML interno de las razas y clases)
                    const searchStr = normalizeStr(JSON.stringify(item));
                    return searchStr.includes(normalizeStr(query));
                });

                if (filteredData.length === 0) {
                    resultsArea.innerHTML = `<p>No se encontraron resultados para "${query}".</p>`;
                    return;

                let resultHtml = "";

                if (category === "Razas") {

                        resultHtml += `<button class="search-bar" style="cursor:pointer; width:auto; margin-bottom:20px; background-color: var(--surface-color);" onclick="currentSelectedRace=null; document.getElementById('local-search').dispatchEvent(new Event('input'))">&larr; Volver a la lista de Razas</button>`;
                        
                        resultHtml += `<div class="card" style="transform:none; cursor:default; border-color:var(--primary-color);">`;
                        resultHtml += `<h3 style="font-size: 1.8em; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">${item.nombre}</h3>`;

                        if (item.subrazas && item.subrazas.length > 0) {
                            resultHtml += `<h4 style="color: var(--primary-color); margin-top: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px;">Subrazas</h4>`;
                            item.subrazas.forEach(sub => {
                                resultHtml += `<div class="race-subrace">`;
                                resultHtml += `<h5>${sub.nombre}</h5>`;
                                resultHtml += `<div>${sub.rasgos}</div>`;
                                resultHtml += `</div>`;
                            });

                        resultHtml += `</div>`;
                        resultsArea.innerHTML = resultHtml;
                    } else {
                        // Vista por defecto: Grid de botones/tarjetas de Razas

                        resultHtml += `<button class="search-bar" style="cursor:pointer; width:auto; margin-bottom:20px; background-color: var(--surface-color);" onclick="currentSelectedClass=null; document.getElementById('local-search').dispatchEvent(new Event('input'))">&larr; Volver a la lista de Clases</button>`;
                        
                        resultHtml += `<div class="card" style="transform:none; cursor:default; border-color:var(--primary-color);">`;
                        resultHtml += `<h3 style="font-size: 2em; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">${item.nombre}</h3>`;
                        resultHtml += `<p style="font-size: 1.1em; color: var(--text-secondary);"><i>${item.descripcion}</i></p>`;
                        
                        if (item.creacion_rapida) {
                            resultHtml += `<div class="race-subrace" style="border-left-color: #64b5f6;">
                                <h5 style="color: #64b5f6;">Creación Rápida</h5>
                                <p style="margin:0;">${item.creacion_rapida}</p>
                            </div>`;
                        }

                        resultHtml += `<h4 style="color: var(--primary-color); margin-top: 25px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px;">Rasgos Básicos</h4>`;
                        resultHtml += `<div class="race-traits">${item.rasgos_basicos}</div>`;
                        
                        if(item.niveles && item.niveles.length > 0){
                            resultHtml += `<h4 style="color: var(--primary-color); margin-top: 25px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px;">Progresión de Clase</h4>`;
                            resultHtml += `<div style="display: flex; flex-direction: column; gap: 10px; margin-top: 15px;">`;
                            item.niveles.forEach(n => {
                                resultHtml += `<div class="level-card">
                                    <h5>Nivel ${n.nivel}</h5>
                                    <div style="font-size:0.95em; line-height:1.5;">${n.rasgos}</div>
                                </div>`;
                            });
                            resultHtml += `</div>`;
                        }

                        if (item.subclases && item.subclases.length > 0) {
                            resultHtml += `<h4 style="color: var(--primary-color); margin-top: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px;">${item.subclases_titulo || "Subclases"}</h4>`;
                            item.subclases.forEach(sub => {
                                resultHtml += `<div class="race-subrace">`;
                                resultHtml += `<h5 style="font-size:1.3em;">${sub.nombre}</h5>`;
                                resultHtml += `<div style="line-height:1.5;">${sub.rasgos}</div>`;
                                resultHtml += `</div>`;
                            });
                        }

                        if (item.invocaciones) {
                            resultHtml += item.invocaciones;
                        }
                        
                        resultHtml += `</div>`;
                        resultsArea.innerHTML = resultHtml;
                    } else {
                        // Vista por defecto: Grid de botones/tarjetas de Clases
                        resultHtml += `<div class="card-grid">`;
                        filteredData.forEach(item => {
                            resultHtml += `<div class="card" style="cursor:pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;" onclick="currentSelectedClass=database['Clases'].find(c=>c.nombre==='${item.nombre}'); document.getElementById('local-search').dispatchEvent(new Event('input'))">`;
                            resultHtml += `<h3 style="font-size: 1.5em; margin-bottom: 10px;">${item.nombre}</h3>`;
                            resultHtml += `<span style="color: var(--text-secondary); font-size: 0.9em;">Click para ver progresión, rasgos y subclases</span>`;
                            resultHtml += `</div>`;
                        });
                        resultHtml += `</div>`;
                        resultsArea.innerHTML = resultHtml;
                    }
                    return;
                }

                // Lógica original para Armaduras y Armas
                // LÓGICA ESPECIAL PARA CONJUROS
                if (category === "Conjuros") {
                    // If a class is selected, show its spells
                    if (window.currentSelectedConjuroClase) {
                        const clase = window.currentSelectedConjuroClase;
                        const classeColors = {"Bardo":"#9c27b0","Brujo":"#4a148c","Clérigo":"#f9a825","Druida":"#2e7d32","Explorador":"#1b5e20","Hechicero":"#bf360c","Mago":"#1565c0","Paladín":"#b71c1c"};
                        const claseColor = classeColors[clase.nombre] || "#d32f2f";
                        const hasDetail = !!clase.conjurosDetalle;
                        resultHtml += `
                            <button onclick="window.currentSelectedConjuroClase=null; document.getElementById('local-search').value=''; document.getElementById('local-search').dispatchEvent(new Event('input'));" 
                                style="background:none;border:1px solid var(--border-color);color:var(--text-secondary);padding:8px 16px;border-radius:20px;cursor:pointer;margin-bottom:24px;font-size:0.9em;">
                                ← Volver a Clases
                            </button>
                            <div style="display:flex;align-items:center;gap:16px;margin-bottom:28px;">
                                <span style="font-size:2.5em;">${clase.icon}</span>
                                <h2 style="margin:0;color:${claseColor};font-size:2em;">${clase.nombre}</h2>
                            </div>
                        `;

                        if (hasDetail) {
                            // Accordion detailed view for Bardo (and future classes)
                            const niveles = clase.conjurosDetalle;
                            Object.entries(niveles).forEach(([nivel, spells]) => {
                                const nivelId = nivel.replace(/\s+/g,'_').replace(/[()]/g,'');
                                resultHtml += `
                                    <div style="margin-bottom:24px;">
                                        <div style="display:flex;align-items:center;gap:12px;border-bottom:2px solid ${claseColor}33;padding-bottom:10px;margin-bottom:12px;">
                                            <h3 style="margin:0;color:${claseColor};font-size:1em;text-transform:uppercase;letter-spacing:1.5px;">${nivel}</h3>
                                            <span style="font-size:0.75em;color:var(--text-secondary);background:rgba(255,255,255,0.05);padding:2px 8px;border-radius:10px;">${spells.length} conjuros</span>
                                        </div>
                                        <div>
                                `;
                                spells.forEach((sp, idx) => {
                                    const uid = `${nivelId}_${idx}`;
                                    const escNombre = sp.nombre.replace(/'/g,"\\'").replace(/"/g,'&quot;');
                                    const escTipo = (sp.tipo||'').replace(/'/g,"\\'");
                                    const escTiempo = (sp.tiempo||'').replace(/'/g,"\\'");
                                    const escAlcance = (sp.alcance||'').replace(/'/g,"\\'");
                                    const escComp = (sp.componentes||'').replace(/'/g,"\\'");
                                    const escDur = (sp.duracion||'').replace(/'/g,"\\'");
                                    const escDesc = (sp.desc||'').replace(/'/g,"\\'").replace(/\n/g,' ');
                                    resultHtml += `
                                        <div style="border:1px solid var(--border-color);border-radius:8px;margin-bottom:6px;overflow:hidden;">
                                            <button onclick="
                                                var c=document.getElementById('spell_${uid}');
                                                var a=document.getElementById('arrow_${uid}');
                                                if(c.style.display==='none'){c.style.display='block';a.style.transform='rotate(90deg)';}
                                                else{c.style.display='none';a.style.transform='rotate(0deg)';}
                                            " style="width:100%;background:rgba(255,255,255,0.03);border:none;color:var(--text-primary);padding:12px 16px;text-align:left;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;">
                                                <div style="display:flex;align-items:center;gap:10px;">
                                                    <span style="font-weight:600;font-size:0.95em;">${sp.nombre}</span>
                                                    <span style="font-size:0.72em;color:var(--text-secondary);font-style:italic;">${sp.tipo||''}</span>
                                                </div>
                                                <span id="arrow_${uid}" style="color:${claseColor};font-size:0.8em;transition:transform 0.2s;">▶</span>
                                            </button>
                                            <div id="spell_${uid}" style="display:none;padding:14px 16px;background:rgba(0,0,0,0.2);border-top:1px solid var(--border-color);">
                                                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-bottom:12px;">
                                                    <div><span style="font-size:0.72em;color:var(--text-secondary);text-transform:uppercase;letter-spacing:1px;">Tiempo</span><div style="font-size:0.88em;color:var(--text-primary);margin-top:2px;">${sp.tiempo||'—'}</div></div>
                                                    <div><span style="font-size:0.72em;color:var(--text-secondary);text-transform:uppercase;letter-spacing:1px;">Alcance</span><div style="font-size:0.88em;color:var(--text-primary);margin-top:2px;">${sp.alcance||'—'}</div></div>
                                                    <div><span style="font-size:0.72em;color:var(--text-secondary);text-transform:uppercase;letter-spacing:1px;">Componentes</span><div style="font-size:0.88em;color:var(--text-primary);margin-top:2px;">${sp.componentes||'—'}</div></div>
                                                    <div><span style="font-size:0.72em;color:var(--text-secondary);text-transform:uppercase;letter-spacing:1px;">Duración</span><div style="font-size:0.88em;color:var(--text-primary);margin-top:2px;">${sp.duracion||'—'}</div></div>
                                                </div>
                                                <div style="font-size:0.85em;color:var(--text-secondary);line-height:1.65;border-top:1px solid var(--border-color);padding-top:10px;">${sp.desc||'—'}</div>
                                            </div>
                                        </div>
                                    `;
                                });
                                resultHtml += `</div></div>`;
                            });
                        } else {
                            // Simple pill view for classes without detail data yet
                            const niveles = clase.niveles;
                            Object.entries(niveles).forEach(([nivel, conjuros]) => {
                                resultHtml += `
                                    <div style="margin-bottom:28px;">
                                        <h3 style="color:${claseColor};border-bottom:1px solid var(--border-color);padding-bottom:8px;margin-bottom:14px;font-size:1.1em;text-transform:uppercase;letter-spacing:1px;">${nivel}</h3>
                                        <div style="display:flex;flex-wrap:wrap;gap:8px;">
                                `;
                                conjuros.forEach(c => {
                                    resultHtml += `<span style="background:rgba(211,47,47,0.08);border:1px solid rgba(211,47,47,0.25);color:var(--text-primary);padding:5px 12px;border-radius:20px;font-size:0.88em;">${c}</span>`;
                                });
                                resultHtml += `</div></div>`;
                            });
                        }
                    } else {
                        // Show class selector grid
                        const classColors = {
                            "Bardo": "#9c27b0", "Brujo": "#4a148c", "Clérigo": "#f9a825",
                            "Druida": "#2e7d32", "Explorador": "#1b5e20", "Hechicero": "#bf360c",
                            "Mago": "#1565c0", "Paladín": "#b71c1c"
                        };
                        resultHtml += `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px;margin-top:8px;">`;
                        filteredData.forEach(clase => {
                            const col = classColors[clase.nombre] || "#d32f2f";
                            const totalSpells = Object.values(clase.niveles).reduce((acc, arr) => acc + arr.length, 0);
                            const numNiveles = Object.keys(clase.niveles).length;
                            resultHtml += `
                                <div onclick="window.currentSelectedConjuroClase=database['Conjuros'].find(c=>c.nombre==='${clase.nombre}'); document.getElementById('local-search').value=''; document.getElementById('local-search').dispatchEvent(new Event('input'));"
                                    style="background:var(--surface-color);border:1px solid var(--border-color);border-top:3px solid ${col};border-radius:10px;padding:24px 20px;cursor:pointer;transition:transform 0.15s,box-shadow 0.15s;text-align:center;"
                                    onmouseover="this.style.transform='translateY(-3px)';this.style.boxShadow='0 6px 20px rgba(0,0,0,0.3)';"
                                    onmouseout="this.style.transform='none';this.style.boxShadow='none';">
                                    <h3 style="margin:0 0 10px;color:${col};font-size:1.1em;">${clase.nombre}</h3>
                                    <div style="font-size:0.8em;color:var(--text-secondary);line-height:1.6;">
                                        <div>${totalSpells} conjuros</div>
                                        <div>${numNiveles} nivel${numNiveles !== 1 ? 'es' : ''}</div>
                                    </div>
                                </div>
                            `;
                        });
                        resultHtml += `</div>`;
                    }
                    resultsArea.innerHTML = resultHtml;
                    return;
                }

                // LÓGICA ESPECIAL PARA TRASFONDOS
                if (category === "Trasfondos") {
                    if (currentSelectedTrasfondo) {
                        const item = currentSelectedTrasfondo;
                        resultHtml += `<button class="search-bar" style="cursor:pointer; width:auto; margin-bottom:20px; background-color: var(--surface-color);" onclick="currentSelectedTrasfondo=null; document.getElementById('local-search').dispatchEvent(new Event('input'))">&larr; Volver a la lista de Trasfondos</button>`;
                        resultHtml += `<div class="card" style="transform:none; cursor:default; border-color:var(--primary-color);">`;
                        if (item.detalle) {
                            resultHtml += `<div class="race-traits">${item.detalle}</div>`;
                        } else {
                            resultHtml += `<h3 style="font-size:1.8em; border-bottom:1px solid var(--border-color); padding-bottom:10px; color:var(--primary-color);">${item.nombre}</h3>`;
                            resultHtml += `<p style="color:var(--text-secondary);">Competencias en Habilidades: <b>${item.habilidades}</b></p>`;
                            resultHtml += `<p style="color:var(--text-secondary); font-style:italic;">Información detallada próximamente.</p>`;
                        }
                        resultHtml += `</div>`;
                        resultsArea.innerHTML = resultHtml;
                    } else {
                        resultHtml += `<div class="card-grid">`;
                        filteredData.forEach(item => {
                            resultHtml += `<div class="card" style="cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;" onclick="currentSelectedTrasfondo=database['Trasfondos'].find(t=>t.nombre==='${item.nombre}'); document.getElementById('local-search').dispatchEvent(new Event('input'))">`;
                            resultHtml += `<h3 style="font-size:1.3em; margin-bottom:8px;">${item.nombre}</h3>`;
                            resultHtml += `<span style="color:var(--text-secondary); font-size:0.82em;">${item.habilidades}</span>`;
                            resultHtml += `</div>`;
                        });
                        resultHtml += `</div>`;
                        resultsArea.innerHTML = resultHtml;
                    }
                    return;
                }

                if (category === "Armaduras" || category === "Armas") {
                    resultHtml += `<table><tr>`;
                    Object.keys(filteredData[0]).forEach(key => {
                        resultHtml += `<th>${key.charAt(0).toUpperCase() + key.slice(1).replace('_', ' ')}</th>`;
                    });
                    resultHtml += `</tr>`;
                    
                    filteredData.forEach(item => {
                        resultHtml += `<tr>`;
                        Object.values(item).forEach(val => {
                            resultHtml += `<td>${val}</td>`;
                        });
                        resultHtml += `</tr>`;
                    });
                    resultHtml += `</table>`;
                } else {
                    // Lógica original para el resto (Trasfondos, Conjuros)
                    resultHtml += `<div class="card-grid">`;
                    filteredData.forEach(item => {
                        resultHtml += `<div class="card"><h3>${item.nombre}</h3>`;
                        Object.entries(item).forEach(([key, val]) => {
                            if (key !== 'nombre') {
                                if(key === 'desc') {
                                    resultHtml += `<p>${val}</p>`;
                                } else {
                                    resultHtml += `<span class="tag"><b>${key.charAt(0).toUpperCase() + key.slice(1).replace('_', ' ')}:</b> ${val}</span>`;
                                }
                            }
                        });
                        resultHtml += `</div>`;
                    });
                    resultHtml += `</div>`;
                }
                resultsArea.innerHTML = resultHtml;
            }

            updateResults("");

            localSearch.addEventListener('input', (e) => {
                updateResults(e.target.value);
            });
        }

        function renderGlobalSearch(query) {
            document.querySelectorAll('#nav-menu button').forEach(btn => btn.classList.remove('active'));
            let html = `<h2 class="section-title">Resultados de búsqueda: "${query}"</h2><br>`;
            let foundAny = false;

            Object.keys(database).forEach(category => {
                const filteredData = database[category].filter(item => {
                    if (category === "Conjuros") {
                        return normalizeStr(item.nombre).includes(normalizeStr(query));
                    }
                    const searchStr = normalizeStr(JSON.stringify(item));
                    return searchStr.includes(normalizeStr(query));
                });

                if(filteredData.length > 0) {
                    foundAny = true;
                    html += `<h3 style="color: var(--text-secondary); border-bottom: 1px solid var(--border-color); padding-bottom: 5px;">En ${category}</h3>`;
                    
                    if (category === "Razas") {
                        // Tarjeta especial para resultados de búsqueda global en razas
                        html += `<div class="card-grid" style="margin-bottom: 30px;">`;
                        filteredData.forEach(item => {
                            html += `<div class="card" style="cursor:pointer;" onclick="document.getElementById('global-search').value=''; renderSection('Razas'); currentSelectedRace=database['Razas'].find(r=>r.nombre==='${item.nombre}'); document.getElementById('local-search').dispatchEvent(new Event('input'))">`;
                            html += `<h3>${item.nombre}</h3>`;
                            html += `<p>Vuelve a la pestaña <b>Razas</b> o haz clic aquí para ver todos sus detalles.</p>`;
                            html += `</div>`;
                        });
                        html += `</div>`;
                    }
                    else if (category === "Clases") {
                        // Tarjeta especial para resultados de búsqueda global en clases
                        html += `<div class="card-grid" style="margin-bottom: 30px;">`;
                        filteredData.forEach(item => {
                            html += `<div class="card" style="cursor:pointer;" onclick="document.getElementById('global-search').value=''; renderSection('Clases'); currentSelectedClass=database['Clases'].find(c=>c.nombre==='${item.nombre}'); document.getElementById('local-search').dispatchEvent(new Event('input'))">`;
                            html += `<h3>${item.nombre}</h3>`;
                            html += `<p>Vuelve a la pestaña <b>Clases</b> o haz clic aquí para ver progresión.</p>`;
                            html += `</div>`;
                        });
                        html += `</div>`;
                    }
                    else if (category === "Armaduras" || category === "Armas") {
                        html += `<table style="margin-bottom: 30px;"><tr>`;
                        Object.keys(filteredData[0]).forEach(key => {
                            html += `<th>${key.charAt(0).toUpperCase() + key.slice(1).replace('_', ' ')}</th>`;
                        });
                        html += `</tr>`;
                        filteredData.forEach(item => {
                            html += `<tr>`;
                            Object.values(item).forEach(val => {
                                html += `<td>${val}</td>`;
                            });
                            html += `</tr>`;
                        });
                        html += `</table>`;
                    } else {
                        html += `<div class="card-grid" style="margin-bottom: 30px;">`;
                        filteredData.forEach(item => {
                            html += `<div class="card"><h3>${item.nombre}</h3>`;
                            Object.entries(item).forEach(([key, val]) => {
                                if (key !== 'nombre' && key !== 'desc') {
                                    html += `<span class="tag"><b>${key.charAt(0).toUpperCase() + key.slice(1)}:</b> ${val}</span>`;
                                }
                            });
                            if(item.desc) html += `<p>${item.desc}</p>`;
                            html += `</div>`;
                        });
                        html += `</div>`;
                    }
                }
            });

            if(!foundAny) html += `<p>La búsqueda no arrojó resultados.</p>`;
            contentArea.innerHTML = html;
        }

        globalSearch.addEventListener('input', (e) => {
            const query = e.target.value;
            if (query.length > 1) {
                renderGlobalSearch(query);
            } else {
                const activeBtn = document.querySelector('#nav-menu button.active') || document.querySelector('#nav-menu button');
                renderSection(activeBtn.textContent);
            }
        });

        // Iniciar la vista
        renderSection("Armaduras");

    </script>
</body>
</html>
